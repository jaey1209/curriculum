<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>나이스 — 최소성취수준보장지도(추가학습) 연수</title>
<link rel="icon" id="favicon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --blue:#3d7be0; --blue-d:#2f66c2; --navy:#1e3461; --green:#22a86a; --green-d:#1b8f59; --gray:#9a9ea7;
  --ink:#333; --ink-2:#555; --ink-3:#8b9099; --line:#d5dae2; --line-2:#e7eaf0; --line-3:#c9cfd9;
  --cond:#eef1f6; --grid-h:#eef2f8; --lab:#c0273f; --sel:#e9f1fc; --paper:#fff; --menu-on:#2b63c6;
  --orange:#ff7a1a; --ok:#1a7f37; --warn:#b25400; --crit:#d0243a;
  --sans:"Noto Sans KR","Pretendard","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sans);font-size:13px;color:var(--ink);background:#fff;line-height:1.5;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font-family:inherit;font-size:13px}
button{cursor:pointer}
a{color:var(--blue)}

/* ───── 로그인(연수용) ───── */
#login{position:fixed;inset:0;background:linear-gradient(135deg,#1e3461,#2f66c2 60%,#5a95ea);display:flex;align-items:center;justify-content:center;z-index:50}
.lg-card{background:#fff;border-radius:12px;width:min(520px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.lg-brand{display:flex;align-items:center;gap:14px;padding:26px 32px 18px;border-bottom:1px solid var(--line-2)}
.lg-logo{font-weight:900;font-size:34px;color:#1d4fb3;letter-spacing:-.02em}
.lg-t{font-size:15px;font-weight:bold;color:#222}
.lg-t small{display:block;font-size:12px;font-weight:normal;color:var(--ink-3);margin-top:2px}
.lg-body{padding:26px 32px 28px;text-align:center}
.lg-desc{font-size:13px;color:var(--ink-2);margin:0 0 20px;line-height:1.7}
.lg-btn{width:100%;height:48px;border:0;border-radius:6px;background:var(--blue);color:#fff;font-size:17px;font-weight:bold}
.lg-btn:hover{background:var(--blue-d)}
.lg-hint{font-size:11px;color:var(--ink-3);margin:14px 0 0}
.status{font-size:12px;color:var(--ink-3)}

/* ───── 나이스 상단 ───── */
#app{display:none;flex-direction:column;height:100vh}
#app.on{display:flex}
.gnb{display:flex;align-items:stretch;background:#fff;border-bottom:1px solid #cfd5df;flex:none}
.gnb .logo{width:230px;flex:none;display:flex;align-items:center;gap:9px;padding:0 14px 0 16px;border-right:1px solid #e7eaf0}
.gnb .logo .emb{width:38px;height:38px;border-radius:50%;background:conic-gradient(#1d4fb3 0 50%,#d0243a 50% 100%);box-shadow:inset 0 0 0 4px #fff,0 0 0 1px #c9cfd9;flex:none}
.gnb .logo .moe{font-size:10.5px;color:#666;line-height:1.25}
.gnb .logo .moe b{display:block;font-size:15px;color:#1d3f7a;letter-spacing:-.02em}
.gnb .gr{flex:1;display:flex;flex-direction:column;min-width:0}
.gnb .band{height:40px;background:#3f7ff0;display:flex;align-items:center;gap:8px;padding:0 12px 0 14px;color:#fff;white-space:nowrap}
.gnb .schip{border:1.5px solid #fff;border-radius:6px;padding:1px 8px;font-size:15px;font-weight:bold}
.gnb .uname{font-size:15px}
.gnb .sp{flex:1}
.gnb .timer{display:flex;align-items:center;gap:5px;font-size:14px;margin-right:10px}
.gnb .hb{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;background:#fff;color:#333;border:1px solid #d5dae2;border-radius:4px;font-size:13.5px;white-space:nowrap;cursor:pointer}
.gnb .hb:hover{background:#f4f7fd}
.gnb .hb.bot{color:#1d4fb3;font-weight:bold}
.gnb .hb.bot.off{color:#888;font-weight:normal}
.gnb .hb .sw{position:relative;width:36px;height:20px;border-radius:10px;background:#22a86a;flex:none;transition:.2s}
.gnb .hb .sw i{position:absolute;top:2px;left:18px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:.2s}
.gnb .hb .swt{font-size:11px;font-weight:bold;color:#1a7f37;min-width:22px;text-align:left}
.gnb .hb.off .sw{background:#c3c8d0}.gnb .hb.off .sw i{left:2px}.gnb .hb.off .swt{color:#888}
.gnb .hb.off .bico{filter:grayscale(1);opacity:.6}
.gnb .hb .bico{margin:0;width:20px;height:20px}
.gnb .hbg{display:inline-flex;margin-left:6px}.gnb .hbg .hb{border-radius:0;width:34px;padding:0;justify-content:center}.gnb .hbg .hb:first-child{border-radius:4px 0 0 4px}.gnb .hbg .hb:last-child{border-radius:0 4px 4px 0;border-left:0}
.gnb .rrow{height:40px;display:flex;align-items:stretch;padding:0 4px}
.roles{display:flex;align-items:stretch;height:100%;gap:2px}
.roles button{white-space:nowrap;background:none;border:0;padding:0 18px;font-size:16px;color:#222;border-bottom:2px solid transparent}
.roles button:hover{color:#2b63c6}
.roles button.next{outline:3px solid var(--orange);outline-offset:-3px;animation:pulse 1.2s infinite;color:#b25400}
.roles button.on{color:#2b63c6;border-bottom-color:#2b63c6;font-weight:bold}
.gnb .meta{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:12px;color:#666;white-space:nowrap;padding-right:10px}
.gnb .copy{font-size:11px;color:#8b9099}
@media(max-width:1400px){.roles button{padding:0 12px;font-size:15px}.gnb .logo{width:200px}.gnb .hb{padding:0 9px}}
@media(max-width:1300px){#gDate{display:none}.gnb .timer{display:none}}
.bico{display:inline-block;width:20px;height:20px;vertical-align:-5px;margin:0 2px}
.bico svg{width:100%;height:100%;display:block}

/* ───── 본문: 아이콘 줄 · 왼쪽 메뉴 · 화면 · 하단 탭바 ───── */
.body{flex:1;display:flex;min-height:0}
.rail{width:46px;flex:none;background:#fff;border-right:1px solid #cfd5df;display:flex;flex-direction:column;align-items:center;padding-top:6px;gap:4px}
.rail button{width:36px;height:36px;border:0;border-radius:4px;background:none;display:flex;align-items:center;justify-content:center;position:relative}
.rail button:hover{background:#eef3fb}
.rail button.on{background:#2b63c6}
.rail button.on svg{stroke:#fff}
.rail svg{width:22px;height:22px;stroke:#2b63c6;fill:none;stroke-width:1.7}
.rail .dot{position:absolute;top:6px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--crit)}
.rail .mj{margin-top:auto;margin-bottom:6px;width:36px;height:24px;background:#22a86a;color:#fff;font-size:11px;font-weight:bold;border-radius:3px}
.rail .mj:hover{background:#1b8f59}
.tree{width:230px;background:#fff;border-right:1px solid var(--line);overflow:auto;flex:none;position:relative;font-size:13px}
.tree .grp{display:flex;align-items:center;padding:8px 8px 8px 12px;font-weight:bold;color:#1f2d4d;border-bottom:1px solid var(--line-2);cursor:pointer;background:#fff}
.tree .grp:hover{background:#f6f8fb}
.tree .grp.open{color:var(--menu-on);background:#f4f7fd}
.tree .grp .chev{margin-left:auto;font-size:10px;color:#666;transform:rotate(0)}
.tree .grp.open .chev{transform:rotate(180deg)}
.tree .items{display:none;padding:4px 0 6px;border-bottom:1px solid var(--line-2);background:#fff}
.tree .grp.open+.items{display:block}
.tree .it{display:block;width:100%;text-align:left;background:none;border:0;padding:5px 14px 5px 22px;color:#333;font-size:13px;line-height:1.35;white-space:normal;word-break:keep-all;overflow-wrap:anywhere;position:relative}
.tree .it:hover{color:var(--menu-on)}
.tree .it.on{color:var(--menu-on);font-weight:bold}
.tree .it.next{box-shadow:inset 3px 0 0 var(--orange)}
.tree .fold{position:absolute;right:0;top:50%;width:12px;height:60px;background:#2b63c6;color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;border-radius:4px 0 0 4px;transform:translateY(-50%);cursor:pointer;z-index:2}
.tree.folded{width:14px;overflow:hidden}
.tree.folded>*:not(.fold){display:none}
.mainwrap{flex:1;display:flex;flex-direction:column;min-width:0}
.main{flex:1;overflow:auto;padding:10px 18px 120px;min-width:0;background:#fff}
.tabbar{height:32px;flex:none;border-top:1px solid #cfd5df;background:#f5f7fa;display:flex;align-items:center;gap:4px;padding:0 8px;overflow:hidden}
.tabbar .home{background:#1d4fb3;color:#fff;border:0;border-radius:2px;height:24px;padding:0 14px;font-size:12px;font-weight:bold;flex:none}
.tabbar .tb{display:flex;align-items:center;gap:6px;height:24px;padding:0 8px;border:1px solid #cfd5df;border-bottom:2px solid transparent;background:#fff;font-size:12px;color:#444;max-width:230px;flex:none;cursor:pointer}
.tabbar .tb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabbar .tb.on{border-bottom-color:#1d4fb3;color:#1d3f7a;font-weight:bold}
.tabbar .tb .x{border:0;background:none;color:#888;font-size:12px;padding:0}
.tabbar .tb .x:hover{color:var(--crit)}
.tabbar .sp{flex:1}
.tabbar .ctl{border:1px solid #cfd5df;background:#fff;height:22px;min-width:22px;border-radius:2px;font-size:11px;color:#444;padding:0 6px;flex:none}
.tabbar .ctl .cnt{display:inline-block;background:#1d4fb3;color:#fff;border-radius:50%;width:15px;height:15px;line-height:15px;text-align:center;font-size:10px;margin-right:3px}
/* 전체 메뉴판 */
.mega{position:fixed;left:46px;top:81px;right:0;background:#fff;border-bottom:1px solid #cfd5df;box-shadow:0 12px 30px rgba(0,0,0,.18);z-index:45;display:none;padding:18px 26px 22px;max-height:calc(100vh - 80px);overflow:auto}
.mega.on{display:block}
.mega .x{position:absolute;right:14px;top:10px;border:1px solid #cfd5df;background:#fff;width:24px;height:24px;border-radius:3px}
.mega .cols{display:flex;gap:30px;flex-wrap:wrap}
.mega .col h4{margin:0 0 10px;font-size:14px;color:#1f2d4d}
.mega .col h4.gd{color:#b25400}
.mega .col a{display:block;font-size:12.5px;color:#444;padding:3px 0;cursor:pointer;white-space:nowrap;text-decoration:none}
.mega .col a:hover{color:#2b63c6;text-decoration:underline}
.mega .col a.live{color:#1d3f7a;font-weight:bold}
.mega .col a.next{color:#b25400;font-weight:bold}
.mega .row2{display:flex;gap:40px;margin-top:22px;padding-top:14px;border-top:1px dashed #dfe3ea}

/* ───── 화면 머리글 ───── */
.ph{display:flex;align-items:center;gap:8px;margin:4px 0 10px}
.ph h2{margin:0;font-size:17px;font-weight:bold;color:#222;display:flex;align-items:center;gap:6px}
.ph h2 i{display:inline-block;width:4px;height:12px;background:#2b63c6;border-radius:1px}
.ph .sp{flex:1}
.ph .crumb{border:1px solid var(--line);border-radius:3px;padding:2px 8px;font-size:11px;color:#333;background:#fff;max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .crumb::before{content:"⌂ ...";color:#2b63c6}
.ib{border:1px solid var(--line);background:#fff;border-radius:3px;height:24px;min-width:26px;padding:0 6px;font-size:11px;color:#333;display:inline-flex;align-items:center;justify-content:center}
.ib-grp{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.ib-grp .ib{border:0;border-right:1px solid var(--line-2);border-radius:0}
.ib-grp .ib:last-child{border-right:0}
.ph .hide{margin-left:14px}

/* ───── 진행 탭(wizard) ───── */
.wiz{display:flex;align-items:center;gap:0;margin-bottom:8px}
.wiz .wt{flex:1;border:1px solid var(--line-3);border-radius:4px;background:#fff;padding:8px 10px;font-size:13px;color:#444;text-align:center;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;overflow:hidden;min-height:40px}
.wiz .wt span{white-space:normal;line-height:1.25;text-align:center}
.wiz .wt2{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.wiz .wt2 .wt{padding:4px 8px;font-size:11.5px;min-height:30px}
.wiz .wt2 .wt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wiz .wt.on{font-weight:bold;color:#111;border:1.5px solid #4f85d6;box-shadow:0 0 0 1px #d7e4f8 inset}
.wiz .wt.next{outline:2px solid var(--orange);outline-offset:-2px}
.wiz .arr{width:22px;text-align:center;color:#8a8f99;font-size:11px;flex:none}
.wiz svg{width:16px;height:16px;flex:none}

/* ───── 조회조건 ───── */
.cond{background:var(--cond);padding:8px 14px;display:flex;align-items:center;gap:14px 28px;flex-wrap:wrap;min-height:44px}
.cond.off{display:none}
.cond .cf{display:flex;align-items:center;gap:6px;position:relative}
.cond .cl{color:var(--lab);font-weight:bold;font-size:13px;white-space:nowrap}
.cond .cl.req::before{content:"*"}
.cond .ci{position:relative;display:inline-block}
.cond .ci::before{content:"";position:absolute;left:1px;top:1px;border-style:solid;border-width:6px 6px 0 0;border-color:#f2873b transparent transparent transparent;z-index:1;pointer-events:none}
.cond .ci.nomark::before{display:none}
.cond select,.cond input[type=text],.cond input[type=date]{border:1px solid #b9c0cc;border-radius:3px;height:28px;padding:0 6px 0 10px;background:#fff;min-width:96px;font-size:13px;color:#333}
.cond select:disabled,.cond input:disabled{background:#fff;color:#444;opacity:1}
.cond .fixed{display:flex;gap:28px;position:relative;padding-bottom:4px}
.cond .fixed::after{content:"";position:absolute;left:0;right:0;bottom:-2px;border-bottom:2px dotted #f2a444}
.cond .radio{display:flex;align-items:center;gap:12px;font-size:12px;color:#333}
.cond .radio label{display:flex;align-items:center;gap:4px}
.cond .sp{flex:1}
.cond .next-field{outline:2px dashed var(--orange);outline-offset:3px;border-radius:3px}
.pop .cond{gap:10px 14px;padding:8px 10px}
.pop .cond select{min-width:84px}
.cond-toggle{display:flex;justify-content:center;margin:0 0 6px}
.cond-toggle span{background:#1e3461;color:#fff;font-size:9px;padding:1px 22px;border-radius:0 0 4px 4px;cursor:pointer}

/* ───── 버튼 ───── */
.btn{border:1px solid transparent;border-radius:3px;height:28px;padding:0 11px;font-size:13px;font-weight:bold;color:#fff;background:var(--blue);position:relative;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;vertical-align:middle}
.btn:hover{background:var(--blue-d)}
.btn.q svg{width:13px;height:13px}
.btn.n{background:var(--navy)}.btn.n:hover{background:#162a50}
.btn.g{background:var(--green)}.btn.g:hover{background:var(--green-d)}
.btn.w{background:#fff;color:#333;border-color:#b9c0cc}.btn.w:hover{background:#f4f6f9}
.btn.s{height:22px;padding:0 8px;font-size:11px}
.btn:disabled{background:var(--gray);color:#fff;border-color:transparent;cursor:not-allowed}
.btn.w:disabled{background:#f1f2f4;color:#aaa}
.btn .gnum{position:absolute;top:-10px;left:-10px;width:18px;height:18px;border-radius:50%;background:var(--orange);color:#fff;font-size:11px;font-weight:bold;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.3);pointer-events:none;z-index:3}
.btn .gnum.done{background:var(--ok)}
.btn.next{outline:3px solid var(--orange);outline-offset:2px;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,122,26,.55)}50%{box-shadow:0 0 0 8px rgba(255,122,26,0)}}
.tbar{display:flex;align-items:center;gap:6px;margin:8px 0 6px;min-height:26px}
.tbar .total{font-size:12px;color:#333;display:flex;align-items:center;gap:6px}
.tbar .total i{font-style:normal;color:#777;font-size:13px}
.tbar .sp{flex:1}
.tbar .rem{font-size:12px;color:#555;margin-right:6px}
.subbar{display:flex;align-items:center;gap:8px;background:#f5f7fa;padding:6px 10px;margin-bottom:8px;font-size:12px}
.subbar input{border:1px solid #b9c0cc;border-radius:3px;height:26px;padding:0 8px;width:180px}

/* ───── 안내 요약 ───── */
.sec{font-weight:bold;font-size:13px;color:#222;margin:8px 0 6px}
.sec::before{content:"☞ ";color:#444}
.sumtbl{border-collapse:collapse;width:100%;border-top:1px solid #b9c0cc;margin-bottom:12px}
.sumtbl td{border-bottom:1px solid var(--line-2);padding:7px 10px;font-size:13px}
.sumtbl td.k{background:#f3f4f7;color:#444;text-align:center;width:150px}
.sumtbl td.v{color:#333}
.tip{position:relative;cursor:help;text-decoration:underline;color:#333}
.tip .tt{display:none;position:absolute;left:0;top:100%;background:#fff;border:1px solid #777;color:#333;padding:2px 8px;white-space:nowrap;z-index:5;font-size:11px;font-weight:normal;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.tip:hover .tt{display:block}
.note{word-break:keep-all;overflow-wrap:anywhere;background:#fff8e6;border:1px solid #f1dfae;border-radius:3px;padding:6px 10px;font-size:12px;color:#7a4d00;margin:6px 0 10px}
.note.crit{background:#fdeaed;border-color:#f3b9c1;color:var(--crit)}
.note.ok{background:#e6f6ec;border-color:#b6e2c6;color:var(--ok)}
.note.info{background:#eef3fb;border-color:#c9d9f2;color:#2b4a7e}
.rem-l{font-size:12px;color:#555;margin:2px 0 6px}

/* ───── 그리드 ───── */
.grid-wrap{border:1px solid #b9c0cc;border-radius:2px;overflow:auto;max-height:calc(100vh - 330px);background:#fff}
.grid-wrap.auto{max-height:none}
table.grid{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;white-space:nowrap}
table.grid th{background:var(--grid-h);color:#333;font-weight:normal;border-bottom:1px solid #cfd5df;border-right:1px solid #dfe3ea;padding:5px 8px;text-align:center;position:sticky;top:0;z-index:2;line-height:1.3}
table.grid th.l2{top:29px}
table.grid th.grp{background:#e7ecf5;font-weight:normal}
table.grid th .srt{color:#9aa3b3;font-size:9px;margin-left:3px;vertical-align:top}
table.grid td{border-bottom:1px solid #e3e7ee;border-right:1px solid #eceff4;padding:5px 8px;text-align:center;font-variant-numeric:tabular-nums;color:#333}
table.grid td.l,table.grid th.l{text-align:left}
table.grid tr:hover td{background:#f7f9fc}
table.grid tr.sel td{background:var(--sel)}
table.grid td input[type=text],table.grid td input[type=number]{border:1px solid #b9c0cc;border-radius:2px;height:24px;padding:0 6px;background:#fff}
table.grid td input[type=number]{width:60px;text-align:right}
table.grid td input.wide{width:100%;min-width:220px}
table.grid td input.note-in{width:100%;min-width:70px;max-width:130px;border:1px solid #b9c0cc;border-radius:2px;height:24px;padding:0 6px}
table.grid td select{border:1px solid #b9c0cc;border-radius:2px;height:24px;padding:0 4px;background:#fff;min-width:120px}
table.grid td input:disabled,table.grid td select:disabled{background:#f1f2f4;color:#888}
table.grid .bad{color:var(--crit);font-weight:bold}
table.grid .good{color:var(--ok)}
table.grid td.next-cell{outline:2px dashed var(--orange);outline-offset:-2px}
table.grid th.next-hdr{outline:2px solid var(--orange);outline-offset:-2px;background:#fff3e6}
table.grid th .gnum{position:absolute;top:-8px;left:-8px;width:18px;height:18px;border-radius:50%;background:var(--orange);color:#fff;font-size:11px;font-weight:bold;display:flex;align-items:center;justify-content:center;z-index:3}
table.grid th .gnum.done{background:var(--ok)}
table.grid .lnk{color:#2b63c6;text-decoration:underline;cursor:pointer}
table.grid input[type=checkbox],table.grid input[type=radio]{width:14px;height:14px;margin:0;vertical-align:middle}
.empty{padding:40px;text-align:center;color:#888;border:1px solid #b9c0cc;background:#fff}
.empty b{color:var(--blue)}
.chip{display:inline-block;font-size:11px;padding:0 6px;border-radius:2px;vertical-align:middle;line-height:18px}
.chip.ok{background:#e6f6ec;color:var(--ok)}.chip.warn{background:#fff3e0;color:var(--warn)}.chip.crit{background:#fdeaed;color:var(--crit)}.chip.lock{background:#eceff3;color:#666}.chip.info{background:#eef3fb;color:#2b4a7e}
.detail{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.ftbl{border-collapse:collapse;width:100%;border-top:1px solid #b9c0cc}
.ftbl td{border-bottom:1px solid var(--line-2);padding:6px 8px;font-size:12px}
.ftbl td.k{background:#fbe9ec;color:var(--lab);font-weight:bold;width:90px;text-align:center}
.ftbl td.k.n{background:#f3f4f7;color:#444;font-weight:normal}
.ftbl td.v input{border:1px solid #b9c0cc;height:24px;padding:0 6px;width:100%;background:#f3f4f7;color:#444}
.bigbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.bigbtns button{background:var(--blue);color:#fff;border:0;border-radius:3px;height:38px;font-weight:bold;font-size:12px}

/* ───── 팝업 ───── */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.3);display:none;align-items:center;justify-content:center;z-index:80}
.scrim.on{display:flex}
.pop{background:#fff;border:1px solid #9aa3b3;min-width:400px;max-width:min(1100px,96vw);box-shadow:0 10px 40px rgba(0,0,0,.35)}
.pop .pt{background:#f3f4f7;border-bottom:1px solid #d5dae2;padding:6px 12px;font-weight:bold;font-size:12px;display:flex;align-items:center}
.pop .pt .x{margin-left:auto;background:none;border:0;font-size:14px;color:#333}
.pop .pb{padding:12px 14px;max-height:70vh;overflow:auto;line-height:1.6}
.pop .pb.pre{white-space:pre-wrap}
.pop .pf{padding:8px 12px 12px;display:flex;justify-content:center;gap:6px}
.pop.confirm{min-width:360px;max-width:460px}
.pop.confirm .pt{display:none}
.pop.confirm .pb{padding:14px 20px 4px}
.pop.confirm .pb .ct{font-weight:bold;font-size:13px;margin-bottom:6px}
.apv{min-width:min(900px,94vw)}
.apv .sect{display:flex;align-items:center;margin:4px 0 8px}
.apv .sect h3{margin:0;font-size:16px;color:#222}
.apv .sect .sp{flex:1}
.apv table.af{border-collapse:collapse;width:100%;border-top:2px solid #555}
.apv table.af>tbody>tr>td{border-bottom:1px solid #e3e7ee;padding:6px 8px;font-size:12px;vertical-align:middle}
.apv table.af td.k{background:#f3f4f7;color:#444;text-align:center;width:110px}
.apv table.af input.in{border:1px solid #b9c0cc;height:28px;padding:0 8px;width:100%;background:#fff}
.apv table.af input.in[readonly]{background:#f3f4f7}
.apv table.af textarea{border:1px solid #b9c0cc;width:100%;height:56px;padding:6px 8px;resize:vertical}
.apv .lnbar{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.apv .lnbar label{display:flex;align-items:center;gap:3px;font-size:12px;margin-right:6px}
.apv .lnbar .sp{flex:1}
.apv .err{color:var(--crit);font-weight:bold;font-size:12px;margin:6px 0 0}
.stabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:8px}
.stabs button{background:#eef1f6;border:1px solid var(--line);border-bottom:0;padding:5px 14px;font-size:12px;color:#444;border-radius:3px 3px 0 0}
.stabs button.on{background:#fff;color:var(--menu-on);font-weight:bold;position:relative;top:1px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:4px;font-size:13px;opacity:0;transition:.25s;z-index:90;pointer-events:none}
.toast.on{opacity:.95}

/* ───── 최성봇(연수 도우미 챗봇) ───── */
#bot{position:fixed;right:18px;bottom:44px;z-index:65;display:none;touch-action:none}
#bot.dragging{opacity:.85}
#bot.dragging .bot-av>svg{animation:none}
#bot.dragging .bot-av{cursor:grabbing}
.bot-av{cursor:grab}
#chat .ch{cursor:grab}
.bot-hint{position:absolute;left:0;top:-22px;z-index:2;font-size:11px;color:#fff;background:rgba(0,0,0,.45);padding:1px 7px;border-radius:999px;white-space:nowrap;pointer-events:none;opacity:0;transition:.2s}
#botAv>svg:hover~.bot-hint{opacity:1}
#bot.R .bot-hint{left:auto;right:0}
#bot.on{display:flex}
.bot-av{width:84px;height:84px;position:relative}
.bot-av>svg{filter:drop-shadow(0 6px 10px rgba(0,0,0,.25));animation:bob 2.6s ease-in-out infinite}
.bot-av:hover>svg{animation-play-state:paused;transform:scale(1.06)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.bot-av .eye{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
.bot-av svg,.msg .mini svg,#chat .ch svg{display:block;overflow:visible;shape-rendering:geometricPrecision}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.bot-av .badge{position:absolute;top:-2px;left:-2px;min-width:20px;height:20px;border-radius:10px;background:var(--crit);color:#fff;font-size:11px;font-weight:bold;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid #fff}
#bot{--pz:1}
.bot-peek{position:fixed;left:0;top:0;width:max-content;max-width:min(calc(420px*var(--pz)),calc(100vw - 120px));word-break:keep-all;overflow-wrap:anywhere;cursor:default;background:#fff;border:2px solid #4f85d6;border-radius:18px;padding:14px 18px;font-size:calc(17px*var(--pz));line-height:1.5;box-shadow:0 6px 18px rgba(0,0,0,.2);color:#1f2d4d;white-space:normal}
.bot-peek::after{content:"";position:absolute;left:-18px;bottom:20px;border:8px solid transparent;border-right-color:#4f85d6}
.bot-peek.L::after{left:auto;right:-18px;border-right-color:transparent;border-left-color:#4f85d6}
.bot-peek.mini::after{bottom:12px}
.bot-peek .pk-x{position:absolute;top:2px;right:2px;width:36px;height:36px;border:0;border-radius:10px;background:none;font-size:22px;line-height:1;color:#8b9099;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
.bot-peek .pk-x:hover{background:#eef3fb}
.bot-peek .pk-x:hover{color:#1d4fb3}
.bot-peek.mini{padding:0;border-width:2px;max-width:none}
.bot-peek .pk-row{display:flex;align-items:center;gap:4px;padding:3px}
.bot-peek .pk-pill{border:0;background:#fff;color:#1d4fb3;font-weight:bold;font-size:calc(15px*var(--pz));padding:8px 12px;border-radius:14px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px;max-width:min(calc(440px*var(--pz)),calc(100vw - 250px))}
.bot-peek .pk-pill:hover{background:#eef3fb}
.bot-peek .pk-pl{overflow:hidden;text-overflow:ellipsis}
.bot-peek .pk-open{flex:none;font-size:.8em;color:#8b9099;font-weight:normal}
.bot-peek .pk-go{flex:none;border:0;background:#2f66c2;color:#fff;border-radius:999px;padding:6px 12px;font-size:calc(14px*var(--pz));font-weight:bold;cursor:pointer;white-space:nowrap}
.bot-peek .pk-t{padding-right:34px;font-size:calc(14px*var(--pz));color:#ff7a1a;font-weight:bold;letter-spacing:.02em;margin-bottom:2px}
.bot-peek .pk-m{font-weight:bold;color:#1d4fb3;font-size:calc(19px*var(--pz));line-height:1.45}
.bot-peek .pk-m small{font-size:.68em;font-weight:normal;color:#8b9099}
.bot-peek .pk-s{color:#555;font-size:calc(15px*var(--pz));margin-top:4px}
.bot-peek .pk-r{margin-top:6px;display:inline-block;background:#fff3e6;border:1px solid #f2c48d;color:#b25400;border-radius:8px;padding:2px 10px;font-size:calc(14px*var(--pz));font-weight:bold}
.bot-peek .pk-sc{margin-top:8px;background:#fff8e6;border:1px solid #f1dfae;border-radius:10px;padding:7px 11px;font-size:calc(15px*var(--pz));color:#5a3d00;line-height:1.5}
.bot-peek .pk-sc b{color:#b25400}
.bot-peek .pk-b{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.bot-peek .pk-b button{border:0;background:#2f66c2;color:#fff;border-radius:999px;padding:7px 16px;font-size:calc(15px*var(--pz));cursor:pointer;font-weight:bold}
.bot-peek .pk-b button.w{background:#eef3fb;color:#1d4fb3}
.bot-peek .pk-b .pk-z{margin-left:auto;display:flex;gap:4px}
.bot-peek .pk-b .pk-z button{background:#fff;border:1px solid #c9d3e3;color:#333;padding:4px 9px;font-size:calc(13px*var(--pz));min-width:36px}
.bot-peek .n{display:inline-flex;width:1.3em;height:1.3em;border-radius:50%;background:var(--orange);color:#fff;font-size:.75em;font-weight:bold;align-items:center;justify-content:center;vertical-align:middle;margin-right:4px}
#chat{position:fixed;left:0;top:0;width:440px;max-width:calc(100vw - 16px);background:#fff;border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.28);display:none;flex-direction:column;overflow:hidden;border:1px solid #d7e0ee}
#chat.on{display:flex}
#chat .ch{background:linear-gradient(135deg,#2f66c2,#5a95ea);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
#chat .ch svg{width:34px;height:34px}
#chat .ch .nm{font-weight:bold;font-size:16px}
#chat .ch .st{font-size:13px;opacity:.9}
#chat .ch .x{margin-left:auto;background:none;border:0;color:#fff;font-size:16px;cursor:pointer}
#chat .cm{padding:12px;height:min(46vh,420px);overflow:auto;background:#f3f6fb;display:flex;flex-direction:column;gap:8px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:92%}
.msg.bot{align-self:flex-start}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg .bub{word-break:keep-all;overflow-wrap:anywhere;padding:10px 14px;border-radius:14px;font-size:15px;line-height:1.55;background:#fff;color:#222;border:1px solid #dde4ee;border-bottom-left-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.msg.user .bub{background:#2f66c2;color:#fff;border:0;border-bottom-left-radius:14px;border-bottom-right-radius:4px}
.msg .bub b{color:#1d4fb3}
.msg.user .bub b{color:#fff}
.msg .bub code{background:#eef2f8;padding:0 4px;border-radius:3px;color:#1e3461;font-family:inherit;font-size:14px}
.msg .bub ol{margin:6px 0 0;padding:0;list-style:none}
.msg .bub li{display:flex;gap:6px;align-items:flex-start;padding:3px 0;border-top:1px dashed #e3e8f0}
.msg .bub li .n{width:18px;height:18px;border-radius:50%;background:var(--orange);color:#fff;font-size:11px;font-weight:bold;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.msg .bub li.done{color:#9aa3b3;text-decoration:line-through}
.msg .bub li.done .n{background:var(--ok)}
.msg .bub li.cur{font-weight:bold}
.msg .mini{width:32px;height:32px;flex:none}
.msg .time{font-size:10px;color:#9aa3b3;align-self:flex-end;white-space:nowrap}
.quick{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;background:#fff;border-top:1px solid #e3e8f0}
.quick button{border:1px solid #4f85d6;background:#fff;color:#1d4fb3;border-radius:999px;padding:6px 13px;font-size:14px;cursor:pointer}
.quick button:hover{background:#eef3fb}
.quick button.p{background:#2f66c2;color:#fff}
#chat .ci{display:flex;gap:6px;padding:8px 10px 10px;background:#fff}
#chat .ci input{flex:1;border:1px solid #c9d3e3;border-radius:999px;height:38px;padding:0 14px;font-size:15px}
#chat .ci button{border:0;background:#2f66c2;color:#fff;border-radius:999px;width:34px;height:34px;font-size:15px;cursor:pointer}
.typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:#9aa3b3;margin:0 1px;animation:ty 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes ty{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-4px)}}

.rail .bbadge{position:absolute;top:2px;right:1px;min-width:16px;height:16px;border-radius:8px;background:var(--crit);color:#fff;font-size:10px;font-weight:bold;display:flex;align-items:center;justify-content:center;padding:0 3px;line-height:1}
.rail .bbadge.fin{background:var(--ok)}
.rail button.on .bbadge{box-shadow:0 0 0 2px #fff}
#noti{position:fixed;left:50px;top:132px;width:340px;max-height:calc(100vh - 90px);overflow:auto;background:#fff;border:1px solid #9aa3b3;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:70;font-size:13px}
#noti .pt{background:#f3f4f7;border-bottom:1px solid #d5dae2;padding:7px 12px;font-weight:bold;display:flex;align-items:center;gap:6px}
#noti .pt .x{margin-left:auto;border:0;background:none;font-size:14px;cursor:pointer;width:28px;height:24px}
#noti .ns{padding:9px 14px 10px}
#noti .h{font-weight:bold;color:#1f2d4d;margin-bottom:6px;display:flex;align-items:center}
#noti .h::before{content:"";display:inline-block;width:4px;height:12px;background:#2b63c6;border-radius:1px;margin-right:6px}
#noti .h b{margin-left:auto;color:#2b63c6}
#noti .bar{height:8px;background:#e7eaf0;border-radius:4px;overflow:hidden;margin-bottom:8px}#noti .bar i{display:block;height:100%;background:#2b63c6}
#noti .v{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;padding:6px 8px;border-radius:4px;font-size:13.5px;color:#888;cursor:pointer;white-space:nowrap}
#noti .v:hover{background:#f6f8fb}
#noti .v .n{width:22px;height:22px;border-radius:50%;border:1px solid #b9c0cc;font-size:11.5px;display:flex;align-items:center;justify-content:center;flex:none;background:#fff;color:#777}
#noti .v small{font-size:10.5px;color:#b25400;border:1px solid #f2c48d;background:#fff3e6;border-radius:3px;padding:0 4px;white-space:nowrap}
#noti .v em{margin-left:auto;font-style:normal;font-size:11.5px;font-weight:bold;color:#2b63c6;white-space:nowrap}#noti .v em.d{color:#999;font-weight:normal}
#noti .v.ok{color:#999}#noti .v.ok .n{background:#2b63c6;border-color:#2b63c6;color:#fff}#noti .v.ok small{opacity:.6}
#noti .v.cur{background:#eef3fb;color:#1f2d4d;font-weight:bold;box-shadow:inset 3px 0 0 #2b63c6}#noti .v.cur .n{border:2px solid #2b63c6;color:#2b63c6}
#noti .ft{display:flex;justify-content:flex-end;gap:4px;padding:6px 10px;border-top:1px solid #e7eaf0;background:#fafbfc}
#noti .ft .btn{height:22px;font-size:11px;padding:0 8px;font-weight:normal}
#noti .vln{display:block;width:2px;height:6px;margin-left:18px;background:#d5dae2}#noti .vln.on{background:#2b63c6}
/* 초기화면 */
.hm{max-width:760px;margin:70px auto 0;text-align:center}
.hm .sc{font-size:15px;color:#667}
.hm h1{font-size:28px;color:#1f2d4d;margin:10px 0 6px}
.hm p{font-size:17px;color:#444;margin:0 0 28px}
.hm .big{height:56px;padding:0 34px;font-size:20px;border-radius:10px}
.hm .hint{margin-top:26px;font-size:14px;color:#8b9099}
/* 연수도우미 */
.steps{list-style:none;margin:0;padding:0}
.steps li{background:#fff;border:1px solid var(--line);border-radius:4px;padding:6px 12px;margin-bottom:5px;line-height:1.45;display:flex;gap:12px;align-items:flex-start;font-size:13px}
.steps .no{width:26px;height:26px;border-radius:50%;background:#e9f0fc;color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:bold;flex:none}
.steps li.done .no{background:var(--ok);color:#fff}
.steps li.done{border-color:var(--ok)}
.steps li.pre{border-left:4px solid #8e7cc3}
.steps li.cur{border-color:var(--orange);box-shadow:0 0 0 2px rgba(255,122,26,.25)}
.steps .t{font-weight:bold}
.steps .d{font-size:12px;color:var(--ink-2);word-break:keep-all;overflow-wrap:anywhere}
.steps .d code{background:#f1f3f5;padding:0 4px;border-radius:2px;font-family:inherit;color:var(--navy)}
.steps .go{margin-left:auto;flex:none}
.log{font-size:12px;font-family:ui-monospace,Consolas,monospace;background:#fff;border:1px solid var(--line);border-radius:4px;padding:8px 10px;max-height:320px;overflow:auto}
.log div{border-bottom:1px dashed var(--line-2);padding:2px 0}
.card{background:#fff;border:1px solid var(--line);border-radius:4px;padding:10px 14px;font-size:13px}
@media print{.gnb,.rail,.tabbar,.mega,.tree,.cond,.cond-toggle,.tbar,#login,.note,.ph,.wiz,#bot{display:none!important}.main{padding:0}.grid-wrap{max-height:none;border:0}}
</style>
</head>

<script>
/* ═════════════════ 기본 자료(가상) ═════════════════ */
const KEY_BASE='neis-msb-v7';
/* 연수 버전: basic(기본·업무담당자 3~8단계) / full(심화·1·2단계 마감 오류부터). 링크 뒤 #심화 → 심화, #기본 → 기본, 없으면 관리자 화면 설정(기본값 basic) */
let mode=(()=>{let h='';try{h=decodeURIComponent((location.hash||'')+(location.search||''));}catch(e){}if(/심화|full/i.test(h))return 'full';if(/기본|basic/i.test(h))return 'basic';try{return localStorage.getItem('neis-mode')==='full'?'full':'basic';}catch(e){return 'basic';}})();
const keyOf=m=>KEY_BASE+'-'+(m||mode);
const MODE_NAME={basic:'기본(업무담당자 3~8단계)',full:'심화(1·2단계 마감 오류부터)'};
const SCHOOL='재영고등학교';
const YEAR=2026, SEM=2;
const TERM_START='2026-08-18', TERM_END='2026-12-31';
const HOLIDAYS={'2026-09-24':1,'2026-09-25':1,'2026-09-26':1,'2026-10-09':1,'2026-12-25':1};
const CLASSES=['1-1','1-2','1-3'];
const SUBJECTS=[
  {id:'mat',name:'공통수학2',credit:4,teacher:'t_lee',area:'수학'},
  {id:'kor',name:'공통국어2',credit:4,teacher:'t_kim',area:'국어'},
  {id:'eng',name:'공통영어2',credit:4,teacher:'t_park',area:'영어'},
];
/* 가상 교사 명단(교과담임·학급담임 표시용). 접속자는 업무담당자 1명으로 모든 화면을 처리합니다. */
const TEACHERS={t_lee:{name:'이**',cls:'1-2'},t_kim:{name:'김**',cls:'1-1'},t_park:{name:'박**',cls:'1-3'}};
const ME={name:'업무담당자'};
const EXC_TYPES=['특수교육대상자','학교외 장소 수강','기타'];
const FAM='김이박최정강조윤장임한오서신권황안송류전홍고문양손배백허유남심노하곽성차주우구민나진지엄채원천방공현';
const G1='민서지수현예하준도우시연윤은채서주승지하태진아율라소윤영은세다';
const G2='준우아연서현민윤호은지빈서율찬우현아연진원영하율리나경수민별우혁';
function rnd(seed){let s=seed%2147483647;if(s<=0)s+=2147483646;return()=>(s=s*16807%2147483647)/2147483647;}
function fmt(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function schoolDays(){const d=[];let cur=new Date(TERM_START+'T00:00:00');const end=new Date(TERM_END+'T00:00:00');while(cur<=end){const iso=fmt(cur);const w=cur.getDay();if(w!==0&&w!==6&&!HOLIDAYS[iso])d.push(iso);cur.setDate(cur.getDate()+1);}return d;}
const DAYS=schoolDays();
const TT={mat:{1:2,2:3,4:1,5:4},kor:{1:1,2:4,3:2,5:3},eng:{1:3,3:1,4:2,5:1}};
function periodsOf(subj){const out=[];DAYS.forEach(d=>{const w=new Date(d+'T00:00:00').getDay();const p=TT[subj][w];if(p)out.push({d,p});});return out;}
const PERIODS={};SUBJECTS.forEach(s=>PERIODS[s.id]=periodsOf(s.id));
function makeStudents(){
  const out={};let r=rnd(20260818);
  CLASSES.forEach(key=>{const [g,c]=key.split('-');out[key]=[];const n=24+Math.floor(r()*3);const used=new Set();
    for(let i=1;i<=n;i++){let nm;do{nm=FAM[Math.floor(r()*FAM.length)]+G1[Math.floor(r()*G1.length)]+G2[Math.floor(r()*G2.length)];}while(used.has(nm));used.add(nm);
      out[key].push({id:`${YEAR}${g}${c}${String(i).padStart(2,'0')}`,g:+g,c:+c,cls:key,no:i,name:nm,gender:r()<.5?'남':'여'});}
    out[key].sort((a,b)=>a.name.localeCompare(b.name,'ko')).forEach((s,i)=>{s.no=i+1;s.name=s.name[0]+'**';});});
  return out;
}

/* ═════════════════ 상태 ═════════════════ */
let S=null, me=null, view={top:'guide',menu:'gd-steps'}, cond={cls:'1-1',subj:'mat',room:'all',tab:'target'}, queried={}, guideOn=true, condHidden=false, openGrp={};
function blank(){return {simDate:'2026-12-31',students:makeStudents(),withdrawn:{},score:{},absent:{},periodClose:{},dayClose:{},roomClose:{},attAll:{done:null,req:null,approved:null},examClose:{},calcAll:{done:null,req:null,approved:null},msb:{},msbMgmt:{saved:null,req:null,approved:null},recReflect:{},approvals:[],log:[]};}
function seedData(){
  S=blank();const r=rnd(4242);const all=allStudents();
  SUBJECTS.forEach(s=>{S.score[s.id]={};S.absent[s.id]={};S.periodClose[s.id]={};S.roomClose[s.id]={};S.examClose[s.id]={written:true,perf:true};S.msb[s.id]={};
    CLASSES.forEach(c=>{S.periodClose[s.id][c]={};S.msb[s.id][c]={targets:null,exc:{},hours:{},hpc:3,creditApplied:null,closed:null,excSaved:false,hoursSaved:false};PERIODS[s.id].forEach(x=>S.periodClose[s.id][c][x.d+'|'+x.p]=true);});
    all.forEach(st=>{const base=45+r()*50;const f=v=>Math.round(Math.min(100,Math.max(5,v)));
      const w1=f(base+(r()-.5)*30),w2=f(base+(r()-.5)*30),p1=f(base+10+(r()-.5)*20),p2=f(base+10+(r()-.5)*20);
      S.score[s.id][st.id]={w1,w2,p1,p2,final:Math.round(w1*.3+w2*.3+p1*.2+p2*.2)};
      S.absent[s.id][st.id]=r()<.85?Math.floor(r()*4):Math.floor(r()*12);});
  });
  CLASSES.forEach(c=>{S.dayClose[c]={};DAYS.forEach(d=>S.dayClose[c][d]=true);});
  const pick=(c,i)=>S.students[c][i];
  [['mat','1-1',2],['mat','1-1',7],['mat','1-2',4],['mat','1-3',11],['mat','1-3',19],['kor','1-2',9],['kor','1-3',3],['eng','1-1',14],['eng','1-2',16]].forEach(([s,c,i])=>{const st=pick(c,i);const sc=S.score[s][st.id];sc.w1=22;sc.w2=28;sc.p1=50;sc.p2=45;sc.final=Math.round(sc.w1*.3+sc.w2*.3+sc.p1*.2+sc.p2*.2);});
  const a1=pick('1-2',12);S.absent.mat[a1.id]=30;S.absent.kor[a1.id]=28;S.absent.eng[a1.id]=27;
  const a2=pick('1-1',20);S.absent.mat[a2.id]=26;
  PERIODS.mat.slice(-3).forEach(x=>{delete S.periodClose.mat['1-2'][x.d+'|'+x.p];});
  delete S.dayClose['1-3']['2026-12-29'];delete S.dayClose['1-3']['2026-12-30'];
  PERIODS.eng.slice(-1).forEach(x=>{delete S.periodClose.eng['1-1'][x.d+'|'+x.p];});
  S.examClose.eng.perf=false;
  /* 연수 시나리오(공통수학2): 예외 1명(특수교육대상자), 참여시수 부족 미이수 1명 */
  S.scen={exc:pick('1-2',4).id,excType:'특수교육대상자',un:pick('1-3',19).id,unHours:5};
  /* 공통국어2·공통영어2는 최성보(3~6단계)를 마친 상태로 시작 — 연수는 공통수학2만 실습 */
  ['kor','eng'].forEach(sid=>CLASSES.forEach(c=>{const m=S.msb[sid][c];const at={by:'담당 교과',at:'2026-12-31 09:00'};
    m.targets=students(c).filter(st=>shortfall(sid,st.id).length).map(st=>st.id);m.hours={};m.targets.forEach(id=>m.hours[id]={h:Math.ceil(subj(sid).credit*m.hpc*2/3)+1,note:''});
    m.excSaved=true;m.hoursSaved=true;m.creditApplied=at;m.closed=at;m.fetchedAt=at.at;}));
  if(mode==='basic')preDone();
  S.log=[];addLog('시스템',mode==='basic'?'가상 자료 생성(기본: 출결·성적 마감 완료 상태)':'가상 자료 생성(심화: 마감 오류 포함)');save();
}
function save(){try{localStorage.setItem(keyOf(),JSON.stringify(S));}catch(e){}}
function load(){try{const j=localStorage.getItem(keyOf());if(j){S=JSON.parse(j);return true;}}catch(e){}return false;}
const otherMode=()=>mode==='full'?'basic':'full';
function otherState(){try{const j=localStorage.getItem(keyOf(otherMode()));return j?JSON.parse(j):null;}catch(e){return null;}}
function saveOther(o){try{localStorage.setItem(keyOf(otherMode()),JSON.stringify(o));}catch(e){}}
function addLog(who,what){S.log.unshift({ts:new Date().toISOString(),sim:S.simDate,who,what});if(S.log.length>2000)S.log.length=2000;}
const logDate=e=>typeof e==='string'?'(날짜 없음)':e.ts.slice(0,10);
const logLine=e=>typeof e==='string'?esc(e):`${e.ts.slice(11,16)} <span style="color:#8b9099">(기준일 ${e.sim})</span> [${esc(e.who)}] ${esc(e.what)}`;
function nowStr(){const d=new Date();return `${S.simDate} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const subj=id=>SUBJECTS.find(s=>s.id===id);
const subjLabel=id=>`${subj(id).name}(${subj(id).credit})`;
const userName=id=>(TEACHERS[id]||{}).name||id;
const homeroomOf=c=>Object.keys(TEACHERS).find(k=>TEACHERS[k].cls===c);
const students=cls=>S.students[cls]||[];
const allStudents=()=>Object.values(S.students).flat();
const studentById=id=>allStudents().find(s=>s.id===id);
const clsName=k=>{const [g,c]=k.split('-');return `${g}학년 ${c}반`;};
const roomLabel=(s,c)=>`${subj(s).name} ${clsName(c)}`;
const can={teacherOf:()=>true,homeroomOf:()=>true,admin:()=>true,approver:()=>true};
/* 상단 업무 탭(역할): 최성보업무(업무담당자) · 교과담임 · 학급담임 — 각 작업은 맞는 탭에서만 할 수 있음 */
const curRole=()=>cond.role||'최성보업무';
const tabRole=r=>/교과담임/.test(r||'')?'교과담임':/학급담임/.test(r||'')?'학급담임':'최성보업무';
function roleOK(r){if(curRole()===r)return true;alertBox('알림',`이 작업은 상단 [${r}] 탭에서 할 수 있어요.\n화면 위쪽의 [${r}]을(를) 누른 뒤 다시 해 보세요.`);return false;}
const roleNote=(r,what)=>curRole()===r?'':`<div class="note crit" style="margin:0 0 8px">👤 ${what} 상단 <b>[${r}]</b> 탭에서 할 수 있어요. 지금은 [${curRole()}] 탭이에요.</div>`;
const total=s=>PERIODS[s].length;
const attendOf=(s,sid)=>total(s)-(S.absent[s][sid]||0);
const needAttend=s=>Math.ceil(total(s)*2/3);
const attOK=(s,sid)=>attendOf(s,sid)>=needAttend(s);
const achieve=v=>v>=90?'A':v>=80?'B':v>=70?'C':v>=60?'D':'E';
const finalOf=(s,sid)=>S.score[s][sid].final;
const achOK=(s,sid)=>finalOf(s,sid)>=40;
function shortfall(s,sid){const f=[];if(!attOK(s,sid))f.push('출석');if(!achOK(s,sid))f.push('학업');return f;}
const periodCloseCnt=(s,c)=>Object.keys(S.periodClose[s][c]).length;
const dayCloseCnt=(s,c)=>PERIODS[s].filter(x=>S.dayClose[c][x.d]).length;
const roomClosed=(s,c)=>!!S.roomClose[s][c];
const allRoomsClosed=()=>SUBJECTS.every(s=>CLASSES.every(c=>roomClosed(s.id,c)));
const attAllApproved=()=>!!S.attAll.approved;
const calcAllApproved=()=>!!S.calcAll.approved;
const msbOf=(s,c)=>S.msb[s][c];
const PRACTICE_SUBJ='mat';
const scenStu=k=>S.scen&&S.scen[k]?studentById(S.scen[k]):null;
const stuLabel=st=>`${st.c}반 ${st.no}번 ${st.name}`;
function scenNote(s,who){if(s!==PRACTICE_SUBJ||!S.scen)return who?ACTUAL_NOTE(who[0],who[1]):'';const e=scenStu('exc'),u=scenStu('un');
  return `<div class="note info scen" style="margin:0 0 8px;padding:5px 10px;line-height:1.55">${who?`<b style="color:#b25400">👤 실제 담당: ${who[0]}</b> <span style="color:#7a5a2e">(연수에서는 업무담당자가 대신 입력해 봐요)</span><br>`:''}📋 <b>연수 시나리오(${subj(s).name})</b> ① <b>${stuLabel(e)}</b> — 특수교육대상자 → 예외 선택 &nbsp;② <b>${stuLabel(u)}</b> — ${S.scen.unHours}시수만 참여 → <b>미이수</b> &nbsp;③ 나머지 — 8~12시수 → 이수 <span class="status">(공통국어2·공통영어2는 마감 완료 · 실제로는 과목마다 반복)</span></div>`;}
const ICON={search:'<svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>',

function go(top,menu){
  view.top=top;if(menu)view.menu=menu;else{const first=MENUS[top].flatMap(g=>g.items).find(i=>typeof i==='object');view.menu=first?first.id:null;}

  if(view.menu&&view.menu!=='gd-steps'&&!openTabs.includes(view.menu)){openTabs.push(view.menu);if(openTabs.length>7)openTabs.shift();}
  megaOpen(false);
  const na=guideOn?nextAction():null;
  $('#roles').innerHTML=ROLES.map(r=>`<button class="${(cond.role||'최성보업무')===r?'on':''}" onclick="roleClick('${r}')">${r}</button>`).join('');

  const mod=top==='guide'?'score':top;

  renderTabbar();
  $('#gDate').textContent=`기준일 ${S.simDate}`;
  render();
}
function renderTabbar(){
  $('#tabbar').innerHTML=`<button class="home" onclick="go('guide','gd-steps')">초기화면</button>`+openTabs.map(id=>`<div class="tb ${view.menu===id?'on':''}" onclick="go(topOf('${id}'),'${id}')"><span>📄 ${menuName(id)}</span><button class="x" title="닫기" onclick="event.stopPropagation();closeTab('${id}')">✕</button></div>`).join('')
   +`<span class="sp"></span><button class="ctl" onclick="tabStep(-1)">‹</button><button class="ctl" onclick="tabStep(1)">›</button><button class="ctl" title="현재 탭 닫기" onclick="closeTab(view.menu)">✕</button><button class="ctl" title="모든 탭 닫기" onclick="openTabs=[];go('guide','gd-steps')">⨯</button><button class="ctl"><span class="cnt">${openTabs.length}</span>목록보기</button><button class="ctl" onclick="toast('전체화면은 브라우저의 F11 키를 이용하세요.')">⇱ 전체화면</button>`;
}
function closeTab(id){const i=openTabs.indexOf(id);if(i<0)return;openTabs.splice(i,1);if(view.menu===id){const n=openTabs[i]||openTabs[i-1];n?go(topOf(n),n):go('guide','gd-steps');}else renderTabbar();}
function tabStep(d){const i=openTabs.indexOf(view.menu);const n=openTabs[i+d];if(n)go(topOf(n),n);}
function roleClick(r){if(r==='업무분장설정업무'){toast('업무분장설정업무는 연수 범위 밖입니다.');return;}if(curRole()===r)return;cond.role=r;toast(`[${r}] 업무로 바꿨어요.`);go(view.top,view.menu);}
function railClick(k){if(k==='bell'){notiShow(!notiOpen);return;}if(k==='set'){notiShow(false);go('guide','gd-admin');return;}if(k==='menu'){notiShow(false);megaOpen();return;} toast('연수 범위 밖 기능입니다. 메뉴는 [전체메뉴] 아이콘이나 왼쪽 메뉴에서 고르세요.');}
function megaOpen(v){const m=$('#mega');if(!m)return;const on=v===undefined?!m.classList.contains('on'):v;m.classList.toggle('on',on);if(!on)return;
  const na=guideOn?nextAction():null;const naGrp=na?MENU_GRP[na.menu]:null;
  const col=([title,items,mod])=>`<div class="col"><h4>${title}</h4>${mod?MENUS[mod].map(g=>{const live=g.items.some(i=>typeof i==='object'&&!hiddenMenu(i.id));return `<a class="${live?'live':''} ${naGrp===g.grp&&topOf(na.menu)===mod?'next':''}" onclick="megaPick('${mod}','${g.grp}')">${g.grp}</a>`;}).join(''):items.map(i=>`<a onclick="toast('연수 범위 밖 메뉴입니다.')">${i}</a>`).join('')}</div>`;
  m.innerHTML=`<button class="x" onclick="megaOpen(false)">✕</button><div class="cols">${MEGA.map(col).join('')}</div>
  <div class="row2"><div class="col"><h4>[업무승인관리]업무승인</h4>${['결재문서관리','결재진행관리','결재완료문서관리','결재반려문서관리'].map(i=>`<a onclick="toast('연수에서는 승인요청 뒤 [결재완료 처리(연수용)] 버튼으로 결재를 대신해요.')">${i}</a>`).join('')}</div><div class="col"><h4>학교업무환경</h4><a onclick="toast('연수 범위 밖 메뉴입니다.')">학교업무분장설정</a></div></div>`;}
function megaPick(mod,grp){const g=MENUS[mod].find(x=>x.grp===grp);const first=g.items.find(i=>typeof i==='object'&&!hiddenMenu(i.id));if(first){go(mod,first.id);return;}

  if(!live){megaOpen(false);toast(`[${grp}]은(는) 연수 범위 밖 메뉴입니다. (실제 나이스에만 있음)`);return;}
  go(mod,view.menu&&topOf(view.menu)===mod?view.menu:live.id);openGrp[mod]=null;toggleGrp(mod,grp);toast(`[${grp}] 아래 메뉴는 연수 범위 밖입니다. (실제 나이스에만 있음)`);}

  +(rows?`<div class="grid-wrap"><table class="grid"><thead><tr><th rowspan="2"><input type="checkbox" onclick="document.querySelectorAll('.hck:not(:disabled)').forEach(x=>x.checked=this.checked)"></th><th colspan="4" class="grp">최소 성취수준 보장지도(추가학습) 대상자</th><th colspan="4" class="grp">최소 성취수준 보장지도(추가학습) 대상과목</th><th colspan="2" class="grp">최소 성취수준 보장지도(추가학습) 사유</th><th colspan="5" class="grp">최소 성취수준 보장지도(추가학습)</th><th rowspan="2">학점<br>반영<br>여부</th></tr><tr>${th('반','class="l2"')}${th('번호','class="l2"')}${th('성명','class="l2 l"')}${th('학적변동','class="l2"')}${th('편제','class="l2"')}${th('과목','class="l2"')}${th('학점','class="l2"')}${th('학점당<br>시수','class="l2"')}${th('과목<br>출석률','class="l2"')}${th('학업<br>성취률','class="l2"')}${th('필요<br>시수','class="l2"')}${th('이수<br>기준','class="l2"')}${th('참여<br>시수','class="l2"')}${th('이수여부','class="l2"')}${th('비고','class="l2 l"')}</tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="empty">조회된 대상자가 없습니다(대상자 미산출 또는 전원 예외처리).</div>'):needQuery());

const hpcOf=(m,sid)=>(m.hpcStu&&m.hpcStu[sid])||m.hpc;
function hpcSet(s,c,sid,v,el){const m=msbOf(s,c);m.hpcStu=m.hpcStu||{};m.hpcStu[sid]=+v||3;m.hoursSaved=false;save();if(!el){render();return;}hoursRow(s,c,sid,el.closest('tr'));renderGuide();}
function hpcApply(s){const v=+($('#hpcIn')||{}).value;const ck=[...document.querySelectorAll('.hck:checked')];if(!ck.length){alertBox('알림','선택된 내역이 없습니다.');return;}if(!(v>0)){alertBox('알림','학점당 시수를 입력해주세요.');return;}
  ck.forEach(x=>{const m=msbOf(s,x.dataset.c);m.hpcStu=m.hpcStu||{};m.hpcStu[x.dataset.sid]=v;m.hoursSaved=false;});save();render();alertBox('알림',`선택한 ${ck.length}명에게 학점당 ${v}시수를 적용했습니다.`);}
function hoursSet(s,c,sid,k,v,el){const m=msbOf(s,c);m.hours[sid]=m.hours[sid]||{};m.hours[sid][k]=k==='h'?(v===''?null:+v):v;m.hoursSaved=false;save();
  if(!el){render();return;}if(k==='h'){hoursRow(s,c,sid,el.closest('tr'));renderGuide();}}
/* 참여시수 행만 갱신(필요시수·이수기준·이수여부·점선 표시) */
function hoursRow(s,c,sid,tr){if(!tr)return;const m=msbOf(s,c);const need=subj(s).credit*hpcOf(m,sid),base=Math.ceil(need*2/3);const h=(m.hours[sid]||{}).h;
  const q=x=>tr.querySelector(x);if(q('.c-need'))q('.c-need').textContent=need;if(q('.c-base'))q('.c-base').textContent=base;
  const hi=q('.hin');if(hi){hi.max=need;hi.parentElement.classList.toggle('hours-cell',h==null);if(h!=null)hi.parentElement.classList.remove('next-cell');}
  const r=q('.c-res option');if(r)r.textContent=h==null?'':h>=base?'이수':'미이수';}
/* Tab·Enter: 다음 학생 참여시수 칸으로, Shift+Tab: 이전 학생 */
function hinKey(e,el){if(e.key!=='Tab'&&e.key!=='Enter')return;const all=[...document.querySelectorAll('input.hin:not(:disabled)')];const j=all.indexOf(el)+(e.shiftKey?-1:1);
  if(all[j]){e.preventDefault();all[j].focus();try{all[j].select();}catch(_){}}else if(!e.shiftKey){e.preventDefault();const b=document.getElementById('b-save');if(b)b.focus();}}
function hoursSave(s){roomsOf().forEach(c=>msbOf(s,c).hoursSaved=true);addLog(me.name,`이수관리 저장 ${s}`);save();render();alertBox('알림','자료의 저장이 완료되었습니다.');}
function msbRoomStats(s,c){const m=msbOf(s,c);const T=msbTargets(s,c);let ex=0,done=0,un=0,pending=0;T.forEach(st=>{const base=Math.ceil(subj(s).credit*hpcOf(m,st.id)*2/3);if(m.exc[st.id])ex++;else{const h=(m.hours[st.id]||{}).h;if(h==null)pending++;else if(h>=base)done++;else un++;}});return {t:T.length,ex,done,un,pending,applied:m.creditApplied?T.length:0};}
function msbCloseTab(s){
  const q=queried[view.menu];const rooms=roomsOf();const ed=can.teacherOf(s);

  <table class="sumtbl"><tr><td class="k">대상자</td><td class="v">${agg.t} 명</td></tr><tr><td class="k">예외처리자</td><td class="v">${agg.ex} 명</td></tr><tr><td class="k">이수자</td><td class="v">${agg.done} 명</td></tr><tr><td class="k">미이수자</td><td class="v">${agg.un} 명</td></tr><tr><td class="k">학점반영자</td><td class="v">${agg.applied} 명</td></tr><tr><td class="k">마감여부</td><td class="v">${allClosed&&fetched?'마감':'미마감'}${agg.pending?` <span style="color:var(--crit)">(참여시수 미입력 ${agg.pending}명 — [이수관리]에서 입력 후 학점반영 가능)</span>`:''}</td></tr></table>

function creditApply(s){const rooms=roomsOf();confirmBox('확인',`학점반영 하시겠습니까?\n\n· 이수자·예외처리자 → 이수\n· 미이수자 → 미이수`,()=>{rooms.forEach(c=>{const m=msbOf(s,c);if(m.targets)m.creditApplied={by:me.name,at:nowStr()};});addLog(me.name,`최성보 학점반영 ${s} ${rooms.join(',')}`);save();render();alertBox('알림','학기말성적반영이 되었습니다.');});}

function msbResult(s,c,sid){const m=msbOf(s,c);if(!m.targets||!m.targets.includes(sid))return null;const hp=hpcOf(m,sid),need=subj(s).credit*hp,base=Math.ceil(need*2/3);const e=m.exc[sid];const h=(m.hours[sid]||{});return {exc:e,hpc:hp,need,base,h:h.h,note:h.note,done:e?true:(h.h!=null&&h.h>=base),pending:!e&&h.h==null,applied:!!m.creditApplied,closed:!!m.closed};}

  ${na?`<button class="btn big" id="b-start" onclick="guideGo()">▶ ${na.step}단계 ${nm} ${steps().filter(x=>x.ok()).length<=(mode==='basic'?2:0)?'시작하기':'이어서 하기'}</button>`:'<p style="font-size:20px">🎉 8단계를 모두 마쳤어요!</p><button class="btn big" onclick="askReset()">↺ 처음부터 다시</button>'}
  <div class="hint">왼쪽 🔔 아이콘을 누르면 진행 현황이 보이고, 단계를 누르면 그 화면으로 이동해요.</div></div>`;};
SCREENS['gd-rule']=()=>pageHead('학점이수 기준 및 최소 성취수준 보장지도 변경 안내')
  +`<div class="rem-l">※ 2025학년도 2학기부터 적용 (고교학점제 적용 고등학교)</div><div class="grid-wrap auto"><table class="grid"><thead><tr><th>구분</th><th class="l">항목</th><th class="l">당초</th><th class="l">변경</th></tr></thead><tbody>
  <tr><td rowspan="3">학점이수 인정기준</td><td class="l">과목 및 창체의 출석률 충족 기준</td><td class="l">실제 수업횟수의 2/3 이상 출석</td><td class="l">1학점당 수업량(16회)의 2/3 이상 출석</td></tr>
  <tr><td class="l">추가학습 대상자의 학생부 기재</td><td class="l">비고란에 ‘출석률 미달로 인한 추가학습 이수’ 기재</td><td class="l">비고란에 별도 기재사항 없음(1학기 기재 내용은 자동 삭제 처리 예정)</td></tr>
  <tr><td class="l">대안학교 학생의 전·편입학</td><td class="l">고교학점제 적용교로의 전·편입학 시 학점인정 기준 없음</td><td class="l">귀국학생과 동일하게 전입 이전 학기의 학점(전입교 기준) 모두 이수한 것으로 처리</td></tr>
  <tr><td rowspan="3">최소 성취수준 보장지도(최성보)</td><td class="l">운영 시수</td><td class="l">1학점당 5시수</td><td class="l">1학점당 3시수 이상 ※ 전문교과는 1학점당 2시수</td></tr>
  <tr><td class="l">시수 인정 범위</td><td class="l">운영 방법별 최대 인정 시수 범위 규정(권장)</td><td class="l">보충지도(대면지도)를 반드시 포함하여 운영하되, 운영 방법별 시수 인정 범위는 교육감 규정에 따라 학교에서 자율적 운영</td></tr>
  <tr><td class="l">추가학습 운영 방법</td><td class="l">최성보에 준하여 운영</td><td class="l">100% 온라인 프로그램 운영 가능(시수는 최성보와 동일)</td></tr></tbody></table></div>
  <div class="note info" style="margin-top:10px">이 시뮬레이터의 판정: <b>출석 미도달</b> = 출석시수 &lt; 총수업시수×2/3, <b>학업 미도달</b> = 학기말 성취율 40% 미만(E). 이수기준 시수 = (학점 × 학점당 시수)의 2/3. 실제 기준은 교육청 지침·학교 학업성적관리규정을 따르세요.</div>`;
SCREENS['gd-setting']=()=>pageHead('설정·초기화·로그')
  +`<div class="card" style="max-width:760px;margin-bottom:12px"><p><b>시뮬레이션 기준일</b> <input type="date" value="${S.simDate}" onchange="S.simDate=this.value;save();go(view.top,view.menu)"> <span class="status">(처리 이력의 날짜로만 쓰입니다)</span></p>
  <p><button class="btn n" onclick="askReset()">자료 초기화</button>
  ${mode==='full'?`<button class="btn" onclick="confirmBox('확인','1·2단계(출결 마감·성적산출 마감·결재)를 모두 완료 처리하고 3단계부터 연습합니다.',()=>{skipPre();})">사전업무(1·2단계) 완료 처리하고 3단계부터</button>`:''}
  <button class="btn w" onclick="exportJson()">자료 내려받기(JSON)</button> <label class="btn w" style="display:inline-flex">자료 불러오기<input type="file" accept="application/json" style="display:none" onchange="importJson(this.files[0])"></label></p></div>
  <div class="sec">처리 이력(로그)</div>${logGrouped()}`;
function allLogs(){const o=otherState();return S.log.concat(o&&o.log||[]);}
function logGroups(src){const g={};(src||S.log).forEach(e=>{const d=logDate(e);(g[d]=g[d]||[]).push(e);});return Object.keys(g).sort().reverse().map(d=>({d,items:g[d]}));}
function logGrouped(del){const gs=logGroups(del?allLogs():null);if(!gs.length)return '<div class="log"><div>기록 없음</div></div>';return gs.map(g=>`<div class="sec" style="display:flex;align-items:center;gap:10px">${g.d} <span class="status">${g.items.length}건</span>${del?`<button class="btn w s" onclick="adminDelDate('${g.d}')">이 날짜 기록 삭제</button>`:''}</div><div class="log" style="margin-bottom:10px">${g.items.map(e=>`<div>${logLine(e)}</div>`).join('')}</div>`).join('');}
const ADMIN_CODE='1234';
SCREENS['gd-admin']=()=>{
  if(!cond.adminOK)return pageHead('관리자(기록 관리)')+`<div class="card" style="max-width:520px"><p><b>관리자 코드</b>를 입력하세요. 연수 담당자만 사용하는 화면입니다.</p><p style="display:flex;gap:6px"><input type="password" id="adminCode" placeholder="관리자 코드" style="border:1px solid #b9c0cc;height:30px;padding:0 10px;flex:1" onkeydown="if(event.key==='Enter')adminLogin()"><button class="btn" onclick="adminLogin()">확인</button></p><p class="status">※ 기록은 이 PC의 브라우저에만 저장됩니다. 연수실 PC마다 이 화면에서 지워 주세요.</p></div>`;
  const gs=logGroups(allLogs());const total=allLogs().length;
  const mr=m=>`<label style="display:flex;align-items:center;gap:6px;margin:4px 0"><input type="radio" name="mode" ${mode===m?'checked':''} onclick="setMode('${m}')"> <b>${MODE_NAME[m]}</b></label>`;
  return pageHead('관리자(기록 관리)')+`<div class="card" style="max-width:760px;margin-bottom:12px"><div class="sec" style="margin-top:0">연수 버전</div>${mr('basic')}<div class="status" style="margin:0 0 6px 22px">출결 마감·성적 마감이 모두 끝난 상태에서 시작해 업무담당자 일(3~8단계)만 연습해요.</div>${mr('full')}<div class="status" style="margin:0 0 6px 22px">교시·일출결·수행평가 마감이 일부러 빠져 있어, 어디서 막히는지 찾는 연습을 해요.</div><p class="status" style="margin:8px 0 0">※ 이 설정은 이 PC 브라우저에만 적용돼요. 여러 PC에 한 번에 적용하려면 링크를 나눠 주세요. 링크 뒤에 <code>#심화</code>를 붙이면 심화, 아무것도 안 붙이면(또는 <code>#기본</code>) 기본 버전으로 열려요. 두 버전의 실습 내용은 따로 저장돼요.</p></div>`+`<div class="note info">이 브라우저에 저장된 실습 기록(두 버전 합계) ${total}건 · 연수일 ${gs.length}일. 이전 연수 기록은 날짜별로 지우거나, 아래 [전체 실습 자료 초기화]로 처음 상태로 되돌리세요. <b>서버가 없어 다른 PC의 기록은 여기서 지워지지 않습니다.</b></div>
  <div class="tbar"><span class="total">날짜별 기록</span><span class="sp"></span><button class="btn n" onclick="adminDelAll()">전체 로그 삭제</button><button class="btn n" onclick="adminReset()">전체 실습 자료 초기화(로그 포함)</button><button class="btn w" onclick="go('guide','gd-setting')">설정·로그</button><button class="btn w" onclick="cond.adminOK=false;render()">관리자 나가기</button></div>
  <div class="grid-wrap auto"><table class="grid"><thead><tr>${th('연수일')}${th('기록 수')}${th('첫 기록')}${th('마지막 기록')}<th>처리</th></tr></thead><tbody>${gs.map(g=>{const t=g.items.map(e=>typeof e==='string'?'':e.ts.slice(11,16)).filter(Boolean).sort();return `<tr><td>${g.d}</td><td>${g.items.length}</td><td>${t[0]||''}</td><td>${t[t.length-1]||''}</td><td><button class="btn s n" onclick="adminDelDate('${g.d}')">이 날짜 전체 삭제</button></td></tr>`;}).join('')||'<tr><td colspan="5" style="padding:16px;color:#888">기록이 없습니다.</td></tr>'}</tbody></table></div>
  <div style="height:14px"></div>${logGrouped(true)}`;
};
function setMode(m){if(m===mode)return;mode=m;try{localStorage.setItem('neis-mode',m);}catch(e){}if(location.hash){try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}}if(!load())seedData();queried={};chatLog=[];chatSig='';toast(`연수 버전을 [${MODE_NAME[m]}]으로 바꿨어요.`);go('guide','gd-admin');}
function askReset(){confirmBox('확인','모든 실습 내용(마감·예외처리·시수·결재)을 지우고 처음 상태로 되돌립니다.\n최성봇 위치·대화·열린 탭도 처음처럼 돌아갑니다. 진행하시겠습니까?',fullReset);}
function fullReset(){seedData();addLog(me.name,'자료 초기화');save();queried={};openTabs=[];chatLog=[];chatSig='';drawChat();chatOpen(false);$('#botBadge').style.display='none';
  try{localStorage.removeItem('neis-peek-open');}catch(_){}peekMinOn=true;notiShow(false);botHome();openGrp={};cond={cls:'1-1',subj:'mat',room:'all',tab:'target',wdf:'un',rtab:'reflect'};toast('초기화했습니다. 처음부터 연습할 수 있어요.');go('guide','gd-steps');}
function adminLogin(){if($('#adminCode').value===ADMIN_CODE){cond.adminOK=true;render();}else alertBox('알림','관리자 코드가 올바르지 않습니다.');}
function adminDelDate(d){confirmBox('확인',`${d} 기록 ${allLogs().filter(e=>logDate(e)===d).length}건을 모두 삭제하시겠습니까?`,()=>{S.log=S.log.filter(e=>logDate(e)!==d);save();const o=otherState();if(o){o.log=(o.log||[]).filter(e=>logDate(e)!==d);saveOther(o);}toast('삭제했습니다.');render();});}
function adminDelAll(){confirmBox('확인',`전체 로그 ${allLogs().length}건을 모두 삭제하시겠습니까?`,()=>{S.log=[];save();const o=otherState();if(o){o.log=[];saveOther(o);}toast('전체 로그를 삭제했습니다.');render();});}
function adminReset(){confirmBox('확인','마감·예외처리·시수·결재 등 모든 실습 내용과 로그를 지우고 처음 상태로 되돌립니다.\n다음 연수를 위한 초기화입니다(기본·심화 두 버전 모두). 진행하시겠습니까?',()=>{try{localStorage.removeItem(keyOf(otherMode()));}catch(e){}seedData();S.log=[];save();queried={};chatLog=[];chatSig='';toast('초기화했습니다. 다음 연수를 시작할 수 있습니다.');render();});}
function preDone(){CLASSES.forEach(c=>DAYS.forEach(d=>S.dayClose[c][d]=true));SUBJECTS.forEach(s=>{CLASSES.forEach(c=>{PERIODS[s.id].forEach(x=>S.periodClose[s.id][c][x.d+'|'+x.p]=true);S.roomClose[s.id][c]={by:'담당 부서',at:nowStr()};});S.examClose[s.id]={written:true,perf:true};});const a={by:'담당 부서',at:nowStr()};S.attAll={done:a,req:a,approved:a};S.calcAll={done:a,req:a,approved:a};}
function skipPre(){preDone();addLog(me.name,'사전업무(1·2단계) 완료 처리');save();toast('완료 처리했습니다.');cond.tab='target';go('score','msb-manage');}
function exportJson(){const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(S));a.download=`neis-msb-${S.simDate}.json`;a.click();}
function importJson(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();toast('불러왔습니다.');go('guide','gd-steps');}catch(e){toast('파일을 읽을 수 없습니다.');}};r.readAsText(f);}

/* 작업별 업무 탭 확인 */
const ACTION_ROLE={periodClose:'교과담임',bulkPeriodClose:'교과담임',roomCloseTry:'교과담임',roomUnclose:'교과담임',examToggle:'교과담임',hoursSave:'교과담임',hpcApply:'교과담임',
  dayClose:'학급담임',bulkDayClose:'학급담임',recReflectAll:'학급담임',
  fetchTargets:'최성보업무',deleteTargets:'최성보업무',excSave:'최성보업무',creditApply:'최성보업무',msbClose:'최성보업무',msbUnclose:'최성보업무',requestApproval:'최성보업무',simApprove:'최성보업무'};
Object.entries(ACTION_ROLE).forEach(([fn,r])=>{const f=window[fn];if(typeof f!=='function')return;window[fn]=function(...a){if(!roleOK(r))return;return f.apply(this,a);};});
renderLogin();
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
</script>
