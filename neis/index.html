<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>나이스 — 최소성취수준보장지도(추가학습) 연수</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --blue:#3d7be0; --blue-d:#2f66c2; --navy:#1e3461; --green:#22a86a; --green-d:#1b8f59; --gray:#9a9ea7;
  --ink:#333; --ink-2:#555; --ink-3:#8b9099; --line:#d5dae2; --line-2:#e7eaf0; --line-3:#c9cfd9;
  --cond:#eef1f6; --grid-h:#eef2f8; --lab:#c0273f; --sel:#e9f1fc; --paper:#fff; --menu-on:#2b63c6;
  --orange:#ff7a1a; --ok:#1a7f37; --warn:#b25400; --crit:#d0243a;
  --sans:"Noto Sans KR","Pretendard","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sans);font-size:13px;color:var(--ink);background:#fff;line-height:1.5;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font-family:inherit;font-size:13px}
button{cursor:pointer}
a{color:var(--blue)}

/* ───── 로그인(연수용) ───── */
#login{position:fixed;inset:0;background:linear-gradient(135deg,#1e3461,#2f66c2 60%,#5a95ea);display:flex;align-items:center;justify-content:center;z-index:50}
.lg-card{background:#fff;border-radius:12px;width:min(520px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.lg-brand{display:flex;align-items:center;gap:14px;padding:26px 32px 18px;border-bottom:1px solid var(--line-2)}
.lg-logo{font-weight:900;font-size:34px;color:#1d4fb3;letter-spacing:-.02em}
.lg-t{font-size:15px;font-weight:bold;color:#222}
.lg-t small{display:block;font-size:12px;font-weight:normal;color:var(--ink-3);margin-top:2px}
.lg-body{padding:26px 32px 28px;text-align:center}
.lg-desc{font-size:13px;color:var(--ink-2);margin:0 0 20px;line-height:1.7}
.lg-btn{width:100%;height:48px;border:0;border-radius:6px;background:var(--blue);color:#fff;font-size:17px;font-weight:bold}
.lg-btn:hover{background:var(--blue-d)}
.lg-hint{font-size:11px;color:var(--ink-3);margin:14px 0 0}
.status{font-size:12px;color:var(--ink-3)}

/* ───── 나이스 상단 ───── */
#app{display:none;flex-direction:column;height:100vh}
#app.on{display:flex}
.gnb{height:54px;display:flex;align-items:center;padding:0 20px;gap:14px;border-bottom:1px solid var(--line-2);background:#fff}
.gnb .logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:20px;color:#1d4fb3;letter-spacing:-.02em}
.gnb .logo .sub{font-size:12px;font-weight:bold;color:var(--ink-2);border-left:1px solid var(--line);padding-left:10px}
.gnb .school{font-size:12px;color:var(--ink-2)}
.gnb .sp{flex:1}
.gnb .who{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-2)}
.gnb .who b{color:var(--ink)}
.gnb .who .pill{border:1px solid var(--line);border-radius:3px;padding:2px 8px;background:#fff}
.gnb .who .gbtn{border:1px solid var(--orange);background:var(--orange);color:#fff;border-radius:3px;padding:3px 10px;font-weight:bold}
.gnb .who .gbtn.off{background:#fff;color:var(--orange)}
.lnb{height:40px;display:flex;align-items:stretch;padding:0 12px;background:#f5f7fa;border-bottom:1px solid var(--line)}
.lnb button{background:none;border:0;padding:0 18px;font-size:14px;font-weight:bold;color:var(--ink-2);border-bottom:3px solid transparent}
.lnb button.on{color:var(--menu-on);border-bottom-color:var(--menu-on)}
.lnb .guide{margin-left:auto;color:var(--orange);font-size:12px}
.lnb .badge{display:inline-block;min-width:16px;font-size:10px;background:var(--crit);color:#fff;border-radius:8px;padding:0 5px;margin-left:4px;vertical-align:middle;line-height:14px}

/* ───── 본문: 왼쪽 메뉴 ───── */
.body{flex:1;display:flex;min-height:0}
.tree{width:210px;background:#fff;border-right:1px solid var(--line);overflow:auto;flex:none;position:relative;font-size:13px}
.tree .grp{display:flex;align-items:center;padding:8px 8px 8px 10px;font-weight:bold;color:#1f2d4d;border-bottom:1px solid var(--line-2);cursor:pointer;background:#fff}
.tree .grp:hover{background:#f6f8fb}
.tree .grp.open{color:var(--menu-on);background:#f4f7fd}
.tree .grp .chev{margin-left:auto;font-size:10px;color:#666;transform:rotate(0)}
.tree .grp.open .chev{transform:rotate(180deg)}
.tree .items{display:none;padding:4px 0 6px;border-bottom:1px solid var(--line-2);background:#fff}
.tree .grp.open+.items{display:block}
.tree .it{display:block;width:100%;text-align:left;background:none;border:0;padding:4px 8px 4px 18px;color:#333;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.tree .it:hover{color:var(--menu-on)}
.tree .it.on{color:var(--menu-on);font-weight:bold}
.tree .it.next{box-shadow:inset 3px 0 0 var(--orange)}
.tree .fold{position:absolute;right:0;top:50%;width:12px;height:60px;background:#2b63c6;color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;border-radius:4px 0 0 4px;transform:translateY(-50%)}
.main{flex:1;overflow:auto;padding:10px 18px 120px;min-width:0;background:#fff}

/* ───── 화면 머리글 ───── */
.ph{display:flex;align-items:center;gap:8px;margin:4px 0 10px}
.ph h2{margin:0;font-size:17px;font-weight:bold;color:#222;display:flex;align-items:center;gap:6px}
.ph h2 i{display:inline-block;width:4px;height:12px;background:#2b63c6;border-radius:1px}
.ph .sp{flex:1}
.ph .crumb{border:1px solid var(--line);border-radius:3px;padding:2px 8px;font-size:11px;color:#333;background:#fff;max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .crumb::before{content:"⌂ ...";color:#2b63c6}
.ib{border:1px solid var(--line);background:#fff;border-radius:3px;height:24px;min-width:26px;padding:0 6px;font-size:11px;color:#333;display:inline-flex;align-items:center;justify-content:center}
.ib-grp{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.ib-grp .ib{border:0;border-right:1px solid var(--line-2);border-radius:0}
.ib-grp .ib:last-child{border-right:0}
.ph .hide{margin-left:14px}

/* ───── 진행 탭(wizard) ───── */
.wiz{display:flex;align-items:center;gap:0;margin-bottom:8px}
.wiz .wt{flex:1;border:1px solid var(--line-3);border-radius:4px;background:#fff;padding:9px 10px;font-size:13px;color:#444;text-align:center;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;overflow:hidden}
.wiz .wt.on{font-weight:bold;color:#111;border:1.5px solid #4f85d6;box-shadow:0 0 0 1px #d7e4f8 inset}
.wiz .wt.next{outline:2px solid var(--orange);outline-offset:-2px}
.wiz .arr{width:22px;text-align:center;color:#8a8f99;font-size:11px;flex:none}
.wiz svg{width:16px;height:16px;flex:none}

/* ───── 조회조건 ───── */
.cond{background:var(--cond);padding:8px 14px;display:flex;align-items:center;gap:14px 28px;flex-wrap:wrap;min-height:44px}
.cond.off{display:none}
.cond .cf{display:flex;align-items:center;gap:6px;position:relative}
.cond .cl{color:var(--lab);font-weight:bold;font-size:13px;white-space:nowrap}
.cond .cl.req::before{content:"*"}
.cond .ci{position:relative;display:inline-block}
.cond .ci::before{content:"";position:absolute;left:1px;top:1px;border-style:solid;border-width:6px 6px 0 0;border-color:#f2873b transparent transparent transparent;z-index:1;pointer-events:none}
.cond .ci.nomark::before{display:none}
.cond select,.cond input[type=text],.cond input[type=date]{border:1px solid #b9c0cc;border-radius:3px;height:28px;padding:0 6px 0 10px;background:#fff;min-width:96px;font-size:13px;color:#333}
.cond select:disabled,.cond input:disabled{background:#fff;color:#444;opacity:1}
.cond .fixed{display:flex;gap:28px;position:relative;padding-bottom:4px}
.cond .fixed::after{content:"";position:absolute;left:0;right:0;bottom:-2px;border-bottom:2px dotted #f2a444}
.cond .radio{display:flex;align-items:center;gap:12px;font-size:12px;color:#333}
.cond .radio label{display:flex;align-items:center;gap:4px}
.cond .sp{flex:1}
.cond .next-field{outline:2px dashed var(--orange);outline-offset:3px;border-radius:3px}
.pop .cond{gap:10px 14px;padding:8px 10px}
.pop .cond select{min-width:84px}
.cond-toggle{display:flex;justify-content:center;margin:0 0 6px}
.cond-toggle span{background:#1e3461;color:#fff;font-size:9px;padding:1px 22px;border-radius:0 0 4px 4px;cursor:pointer}

/* ───── 버튼 ───── */
.btn{border:1px solid transparent;border-radius:3px;height:28px;padding:0 11px;font-size:13px;font-weight:bold;color:#fff;background:var(--blue);position:relative;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;vertical-align:middle}
.btn:hover{background:var(--blue-d)}
.btn.q svg{width:13px;height:13px}
.btn.n{background:var(--navy)}.btn.n:hover{background:#162a50}
.btn.g{background:var(--green)}.btn.g:hover{background:var(--green-d)}
.btn.w{background:#fff;color:#333;border-color:#b9c0cc}.btn.w:hover{background:#f4f6f9}
.btn.s{height:22px;padding:0 8px;font-size:11px}
.btn:disabled{background:var(--gray);color:#fff;border-color:transparent;cursor:not-allowed}
.btn.w:disabled{background:#f1f2f4;color:#aaa}
.btn .gnum{position:absolute;top:-10px;left:-10px;width:18px;height:18px;border-radius:50%;background:var(--orange);color:#fff;font-size:11px;font-weight:bold;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.3);pointer-events:none;z-index:3}
.btn .gnum.done{background:var(--ok)}
.btn.next{outline:3px solid var(--orange);outline-offset:2px;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,122,26,.55)}50%{box-shadow:0 0 0 8px rgba(255,122,26,0)}}
.tbar{display:flex;align-items:center;gap:6px;margin:8px 0 6px;min-height:26px}
.tbar .total{font-size:12px;color:#333;display:flex;align-items:center;gap:6px}
.tbar .total i{font-style:normal;color:#777;font-size:13px}
.tbar .sp{flex:1}
.tbar .rem{font-size:12px;color:#555;margin-right:6px}
.subbar{display:flex;align-items:center;gap:8px;background:#f5f7fa;padding:6px 10px;margin-bottom:8px;font-size:12px}
.subbar input{border:1px solid #b9c0cc;border-radius:3px;height:26px;padding:0 8px;width:180px}

/* ───── 안내 요약 ───── */
.sec{font-weight:bold;font-size:13px;color:#222;margin:8px 0 6px}
.sec::before{content:"☞ ";color:#444}
.sumtbl{border-collapse:collapse;width:100%;border-top:1px solid #b9c0cc;margin-bottom:12px}
.sumtbl td{border-bottom:1px solid var(--line-2);padding:7px 10px;font-size:13px}
.sumtbl td.k{background:#f3f4f7;color:#444;text-align:center;width:150px}
.sumtbl td.v{color:#333}
.tip{position:relative;cursor:help;text-decoration:underline;color:#333}
.tip .tt{display:none;position:absolute;left:0;top:100%;background:#fff;border:1px solid #777;color:#333;padding:2px 8px;white-space:nowrap;z-index:5;font-size:11px;font-weight:normal;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.tip:hover .tt{display:block}
.note{background:#fff8e6;border:1px solid #f1dfae;border-radius:3px;padding:6px 10px;font-size:12px;color:#7a4d00;margin:6px 0 10px}
.note.crit{background:#fdeaed;border-color:#f3b9c1;color:var(--crit)}
.note.ok{background:#e6f6ec;border-color:#b6e2c6;color:var(--ok)}
.note.info{background:#eef3fb;border-color:#c9d9f2;color:#2b4a7e}
.rem-l{font-size:12px;color:#555;margin:2px 0 6px}

/* ───── 그리드 ───── */
.grid-wrap{border:1px solid #b9c0cc;border-radius:2px;overflow:auto;max-height:calc(100vh - 330px);background:#fff}
.grid-wrap.auto{max-height:none}
table.grid{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;white-space:nowrap}
table.grid th{background:var(--grid-h);color:#333;font-weight:normal;border-bottom:1px solid #cfd5df;border-right:1px solid #dfe3ea;padding:5px 8px;text-align:center;position:sticky;top:0;z-index:2;line-height:1.3}
table.grid th.l2{top:29px}
table.grid th.grp{background:#e7ecf5;font-weight:normal}
table.grid th .srt{color:#9aa3b3;font-size:9px;margin-left:3px;vertical-align:top}
table.grid td{border-bottom:1px solid #e3e7ee;border-right:1px solid #eceff4;padding:5px 8px;text-align:center;font-variant-numeric:tabular-nums;color:#333}
table.grid td.l,table.grid th.l{text-align:left}
table.grid tr:hover td{background:#f7f9fc}
table.grid tr.sel td{background:var(--sel)}
table.grid td input[type=text],table.grid td input[type=number]{border:1px solid #b9c0cc;border-radius:2px;height:24px;padding:0 6px;background:#fff}
table.grid td input[type=number]{width:60px;text-align:right}
table.grid td input.wide{width:100%;min-width:220px}
table.grid td select{border:1px solid #b9c0cc;border-radius:2px;height:24px;padding:0 4px;background:#fff;min-width:120px}
table.grid td input:disabled,table.grid td select:disabled{background:#f1f2f4;color:#888}
table.grid .bad{color:var(--crit);font-weight:bold}
table.grid .good{color:var(--ok)}
table.grid td.next-cell{outline:2px dashed var(--orange);outline-offset:-2px}
table.grid .lnk{color:#2b63c6;text-decoration:underline;cursor:pointer}
table.grid input[type=checkbox],table.grid input[type=radio]{width:14px;height:14px;margin:0;vertical-align:middle}
.empty{padding:40px;text-align:center;color:#888;border:1px solid #b9c0cc;background:#fff}
.empty b{color:var(--blue)}
.chip{display:inline-block;font-size:11px;padding:0 6px;border-radius:2px;vertical-align:middle;line-height:18px}
.chip.ok{background:#e6f6ec;color:var(--ok)}.chip.warn{background:#fff3e0;color:var(--warn)}.chip.crit{background:#fdeaed;color:var(--crit)}.chip.lock{background:#eceff3;color:#666}.chip.info{background:#eef3fb;color:#2b4a7e}
.detail{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.ftbl{border-collapse:collapse;width:100%;border-top:1px solid #b9c0cc}
.ftbl td{border-bottom:1px solid var(--line-2);padding:6px 8px;font-size:12px}
.ftbl td.k{background:#fbe9ec;color:var(--lab);font-weight:bold;width:90px;text-align:center}
.ftbl td.k.n{background:#f3f4f7;color:#444;font-weight:normal}
.ftbl td.v input{border:1px solid #b9c0cc;height:24px;padding:0 6px;width:100%;background:#f3f4f7;color:#444}
.bigbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.bigbtns button{background:var(--blue);color:#fff;border:0;border-radius:3px;height:38px;font-weight:bold;font-size:12px}

/* ───── 팝업 ───── */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.3);display:none;align-items:center;justify-content:center;z-index:60}
.scrim.on{display:flex}
.pop{background:#fff;border:1px solid #9aa3b3;min-width:400px;max-width:min(1100px,96vw);box-shadow:0 10px 40px rgba(0,0,0,.35)}
.pop .pt{background:#f3f4f7;border-bottom:1px solid #d5dae2;padding:6px 12px;font-weight:bold;font-size:12px;display:flex;align-items:center}
.pop .pt .x{margin-left:auto;background:none;border:0;font-size:14px;color:#333}
.pop .pb{padding:12px 14px;max-height:70vh;overflow:auto;line-height:1.6}
.pop .pb.pre{white-space:pre-wrap}
.pop .pf{padding:8px 12px 12px;display:flex;justify-content:center;gap:6px}
.pop.confirm{min-width:360px;max-width:460px}
.pop.confirm .pt{display:none}
.pop.confirm .pb{padding:14px 20px 4px}
.pop.confirm .pb .ct{font-weight:bold;font-size:13px;margin-bottom:6px}
.stabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:8px}
.stabs button{background:#eef1f6;border:1px solid var(--line);border-bottom:0;padding:5px 14px;font-size:12px;color:#444;border-radius:3px 3px 0 0}
.stabs button.on{background:#fff;color:var(--menu-on);font-weight:bold;position:relative;top:1px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:4px;font-size:13px;opacity:0;transition:.25s;z-index:70;pointer-events:none}
.toast.on{opacity:.95}

/* ───── 최성봇(연수 도우미 챗봇) ───── */
#bot{position:fixed;left:22px;bottom:22px;z-index:40;display:none;flex-direction:column;align-items:flex-start;gap:10px;touch-action:none}
#bot.dragging{opacity:.85}
#bot.dragging .bot-av{animation:none;cursor:grabbing}
.bot-av{cursor:grab}
#chat .ch{cursor:grab}
.bot-hint{position:absolute;left:0;top:-22px;font-size:11px;color:#fff;background:rgba(0,0,0,.45);padding:1px 7px;border-radius:999px;white-space:nowrap;pointer-events:none;opacity:0;transition:.2s}
.bot-av:hover .bot-hint{opacity:1}
#bot.on{display:flex}
.bot-av{width:84px;height:84px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25));animation:bob 2.6s ease-in-out infinite;position:relative}
.bot-av:hover{animation-play-state:paused;transform:scale(1.06)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.bot-av .eye{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
.bot-av svg,.msg .mini svg,#chat .ch svg{display:block;overflow:visible;shape-rendering:geometricPrecision}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.bot-av .badge{position:absolute;top:-2px;left:-2px;min-width:20px;height:20px;border-radius:10px;background:var(--crit);color:#fff;font-size:11px;font-weight:bold;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid #fff}
#bot{--pz:1}
.bot-peek{position:absolute;left:96px;bottom:6px;width:max-content;max-width:calc(420px*var(--pz));background:#fff;border:2px solid #4f85d6;border-radius:18px;padding:14px 18px;font-size:calc(17px*var(--pz));line-height:1.5;box-shadow:0 6px 18px rgba(0,0,0,.2);color:#1f2d4d;white-space:normal}
.bot-peek::after{content:"";position:absolute;left:-10px;bottom:20px;border:8px solid transparent;border-right-color:#4f85d6}
.bot-peek .pk-t{font-size:calc(14px*var(--pz));color:#ff7a1a;font-weight:bold;letter-spacing:.02em;margin-bottom:2px}
.bot-peek .pk-m{font-weight:bold;color:#1d4fb3;font-size:calc(19px*var(--pz));line-height:1.45}
.bot-peek .pk-m small{font-size:.68em;font-weight:normal;color:#8b9099}
.bot-peek .pk-s{color:#555;font-size:calc(15px*var(--pz));margin-top:4px}
.bot-peek .pk-b{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.bot-peek .pk-b button{border:0;background:#2f66c2;color:#fff;border-radius:999px;padding:7px 16px;font-size:calc(15px*var(--pz));cursor:pointer;font-weight:bold}
.bot-peek .pk-b button.w{background:#eef3fb;color:#1d4fb3}
.bot-peek .pk-b .pk-z{margin-left:auto;display:flex;gap:4px}
.bot-peek .pk-b .pk-z button{background:#fff;border:1px solid #c9d3e3;color:#333;padding:4px 9px;font-size:calc(13px*var(--pz));min-width:36px}
.bot-peek .n{display:inline-flex;width:1.3em;height:1.3em;border-radius:50%;background:var(--orange);color:#fff;font-size:.75em;font-weight:bold;align-items:center;justify-content:center;vertical-align:middle;margin-right:4px}
#chat{width:440px;max-width:calc(100vw - 44px);background:#fff;border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.28);display:none;flex-direction:column;overflow:hidden;border:1px solid #d7e0ee}
#chat.on{display:flex}
#chat .ch{background:linear-gradient(135deg,#2f66c2,#5a95ea);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
#chat .ch svg{width:34px;height:34px}
#chat .ch .nm{font-weight:bold;font-size:16px}
#chat .ch .st{font-size:13px;opacity:.9}
#chat .ch .x{margin-left:auto;background:none;border:0;color:#fff;font-size:16px;cursor:pointer}
#chat .cm{padding:12px;height:min(46vh,420px);overflow:auto;background:#f3f6fb;display:flex;flex-direction:column;gap:8px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:92%}
.msg.bot{align-self:flex-start}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg .bub{padding:10px 14px;border-radius:14px;font-size:15px;line-height:1.55;background:#fff;color:#222;border:1px solid #dde4ee;border-bottom-left-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.msg.user .bub{background:#2f66c2;color:#fff;border:0;border-bottom-left-radius:14px;border-bottom-right-radius:4px}
.msg .bub b{color:#1d4fb3}
.msg.user .bub b{color:#fff}
.msg .bub code{background:#eef2f8;padding:0 4px;border-radius:3px;color:#1e3461;font-family:inherit;font-size:14px}
.msg .bub ol{margin:6px 0 0;padding:0;list-style:none}
.msg .bub li{display:flex;gap:6px;align-items:flex-start;padding:3px 0;border-top:1px dashed #e3e8f0}
.msg .bub li .n{width:18px;height:18px;border-radius:50%;background:var(--orange);color:#fff;font-size:11px;font-weight:bold;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.msg .bub li.done{color:#9aa3b3;text-decoration:line-through}
.msg .bub li.done .n{background:var(--ok)}
.msg .bub li.cur{font-weight:bold}
.msg .mini{width:32px;height:32px;flex:none}
.msg .time{font-size:10px;color:#9aa3b3;align-self:flex-end;white-space:nowrap}
.quick{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;background:#fff;border-top:1px solid #e3e8f0}
.quick button{border:1px solid #4f85d6;background:#fff;color:#1d4fb3;border-radius:999px;padding:6px 13px;font-size:14px;cursor:pointer}
.quick button:hover{background:#eef3fb}
.quick button.p{background:#2f66c2;color:#fff}
#chat .ci{display:flex;gap:6px;padding:8px 10px 10px;background:#fff}
#chat .ci input{flex:1;border:1px solid #c9d3e3;border-radius:999px;height:38px;padding:0 14px;font-size:15px}
#chat .ci button{border:0;background:#2f66c2;color:#fff;border-radius:999px;width:34px;height:34px;font-size:15px;cursor:pointer}
.typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:#9aa3b3;margin:0 1px;animation:ty 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes ty{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-4px)}}

/* 연수도우미 */
.steps{list-style:none;margin:0;padding:0}
.steps li{background:#fff;border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;font-size:13px}
.steps .no{width:26px;height:26px;border-radius:50%;background:#e9f0fc;color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:bold;flex:none}
.steps li.done .no{background:var(--ok);color:#fff}
.steps li.done{border-color:var(--ok)}
.steps li.pre{border-left:4px solid #8e7cc3}
.steps li.cur{border-color:var(--orange);box-shadow:0 0 0 2px rgba(255,122,26,.25)}
.steps .t{font-weight:bold}
.steps .d{font-size:12px;color:var(--ink-2)}
.steps .d code{background:#f1f3f5;padding:0 4px;border-radius:2px;font-family:inherit;color:var(--navy)}
.steps .go{margin-left:auto;flex:none}
.log{font-size:12px;font-family:ui-monospace,Consolas,monospace;background:#fff;border:1px solid var(--line);border-radius:4px;padding:8px 10px;max-height:320px;overflow:auto}
.log div{border-bottom:1px dashed var(--line-2);padding:2px 0}
.card{background:#fff;border:1px solid var(--line);border-radius:4px;padding:10px 14px;font-size:13px}
@media print{.gnb,.lnb,.tree,.cond,.cond-toggle,.tbar,#login,.note,.ph,.wiz,#bot{display:none!important}.main{padding:0}.grid-wrap{max-height:none;border:0}}

    <div class="cm" id="chatMsgs"></div>

<div class="toast" id="toast"></div>

<script>
/* ═════════════════ 기본 자료(가상) ═════════════════ */
const KEY='neis-msb-v3';
const SCHOOL='재영고등학교';
const YEAR=2026, SEM=2;
const TERM_START='2026-08-18', TERM_END='2026-12-31';
const HOLIDAYS={'2026-09-24':1,'2026-09-25':1,'2026-09-26':1,'2026-10-09':1,'2026-12-25':1};
const CLASSES=['1-1','1-2','1-3'];
const SUBJECTS=[
  {id:'mat',name:'공통수학2',credit:4,teacher:'t_lee',area:'수학'},
  {id:'kor',name:'공통국어2',credit:4,teacher:'t_kim',area:'국어'},
  {id:'eng',name:'공통영어2',credit:4,teacher:'t_park',area:'영어'},
];
/* 가상 교사 명단(교과담임·학급담임 표시용). 접속자는 업무담당자 1명으로 모든 화면을 처리합니다. */
const TEACHERS={t_lee:{name:'이준호',cls:'1-2'},t_kim:{name:'김민정',cls:'1-1'},t_park:{name:'박서연',cls:'1-3'}};
const ME={name:'업무담당자'};
const EXC_TYPES=['특수교육대상자','학교외 장소 수강','기타'];
const FAM='김이박최정강조윤장임한오서신권황안송류전홍고문양손배백허유남심노하곽성차주우구민나진지엄채원천방공현';
const G1='민서지수현예하준도우시연윤은채서주승지하태진아율라소윤영은세다';
const G2='준우아연서현민윤호은지빈서율찬우현아연진원영하율리나경수민별우혁';
function rnd(seed){let s=seed%2147483647;if(s<=0)s+=2147483646;return()=>(s=s*16807%2147483647)/2147483647;}
function fmt(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function schoolDays(){const d=[];let cur=new Date(TERM_START+'T00:00:00');const end=new Date(TERM_END+'T00:00:00');while(cur<=end){const iso=fmt(cur);const w=cur.getDay();if(w!==0&&w!==6&&!HOLIDAYS[iso])d.push(iso);cur.setDate(cur.getDate()+1);}return d;}
const DAYS=schoolDays();
const TT={mat:{1:2,2:3,4:1,5:4},kor:{1:1,2:4,3:2,5:3},eng:{1:3,3:1,4:2,5:1}};
function periodsOf(subj){const out=[];DAYS.forEach(d=>{const w=new Date(d+'T00:00:00').getDay();const p=TT[subj][w];if(p)out.push({d,p});});return out;}
const PERIODS={};SUBJECTS.forEach(s=>PERIODS[s.id]=periodsOf(s.id));
function makeStudents(){
  const out={};let r=rnd(20260818);
  CLASSES.forEach(key=>{const [g,c]=key.split('-');out[key]=[];const n=24+Math.floor(r()*3);const used=new Set();
    for(let i=1;i<=n;i++){let nm;do{nm=FAM[Math.floor(r()*FAM.length)]+G1[Math.floor(r()*G1.length)]+G2[Math.floor(r()*G2.length)];}while(used.has(nm));used.add(nm);
      out[key].push({id:`${YEAR}${g}${c}${String(i).padStart(2,'0')}`,g:+g,c:+c,cls:key,no:i,name:nm,gender:r()<.5?'남':'여'});}
    out[key].sort((a,b)=>a.name.localeCompare(b.name,'ko')).forEach((s,i)=>s.no=i+1);});
  return out;
}

/* ═════════════════ 상태 ═════════════════ */
let S=null, me=null, view={top:'guide',menu:'gd-steps'}, cond={cls:'1-1',subj:'mat',room:'all',tab:'target'}, queried={}, guideOn=true, condHidden=false, openGrp={};
function blank(){return {simDate:'2026-12-31',students:makeStudents(),withdrawn:{},score:{},absent:{},periodClose:{},dayClose:{},roomClose:{},attAll:{done:null,req:null,approved:null},examClose:{},calcAll:{done:null,req:null,approved:null},msb:{},msbMgmt:{saved:null,req:null,approved:null},recReflect:{},approvals:[],log:[]};}
function seedData(){
  S=blank();const r=rnd(4242);const all=allStudents();
  SUBJECTS.forEach(s=>{S.score[s.id]={};S.absent[s.id]={};S.periodClose[s.id]={};S.roomClose[s.id]={};S.examClose[s.id]={written:true,perf:true};S.msb[s.id]={};
    CLASSES.forEach(c=>{S.periodClose[s.id][c]={};S.msb[s.id][c]={targets:null,exc:{},hours:{},hpc:3,creditApplied:null,closed:null,excSaved:false,hoursSaved:false};PERIODS[s.id].forEach(x=>S.periodClose[s.id][c][x.d+'|'+x.p]=true);});
    all.forEach(st=>{const base=45+r()*50;const f=v=>Math.round(Math.min(100,Math.max(5,v)));
      const w1=f(base+(r()-.5)*30),w2=f(base+(r()-.5)*30),p1=f(base+10+(r()-.5)*20),p2=f(base+10+(r()-.5)*20);
      S.score[s.id][st.id]={w1,w2,p1,p2,final:Math.round(w1*.3+w2*.3+p1*.2+p2*.2)};
      S.absent[s.id][st.id]=r()<.85?Math.floor(r()*4):Math.floor(r()*12);});
  });
  CLASSES.forEach(c=>{S.dayClose[c]={};DAYS.forEach(d=>S.dayClose[c][d]=true);});
  const pick=(c,i)=>S.students[c][i];
  [['mat','1-1',2],['mat','1-1',7],['mat','1-2',4],['mat','1-3',11],['mat','1-3',19],['kor','1-2',9],['kor','1-3',3],['eng','1-1',14],['eng','1-2',16]].forEach(([s,c,i])=>{const st=pick(c,i);const sc=S.score[s][st.id];sc.w1=22;sc.w2=28;sc.p1=50;sc.p2=45;sc.final=Math.round(sc.w1*.3+sc.w2*.3+sc.p1*.2+sc.p2*.2);});
  const a1=pick('1-2',12);S.absent.mat[a1.id]=30;S.absent.kor[a1.id]=28;S.absent.eng[a1.id]=27;
  const a2=pick('1-1',20);S.absent.mat[a2.id]=26;
  const wd=pick('1-3',5);S.withdrawn[wd.id]={type:'자퇴',date:'2026.12.18.',reason:'[검정고시] 검정고시 준비',reflected:false};
  PERIODS.mat.slice(-3).forEach(x=>{delete S.periodClose.mat['1-2'][x.d+'|'+x.p];});
  delete S.dayClose['1-3']['2026-12-29'];delete S.dayClose['1-3']['2026-12-30'];
  PERIODS.eng.slice(-1).forEach(x=>{delete S.periodClose.eng['1-1'][x.d+'|'+x.p];});
  S.examClose.eng.perf=false;
  S.log=[];addLog('시스템','가상 자료 생성');save();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function load(){try{const j=localStorage.getItem(KEY);if(j){S=JSON.parse(j);return true;}}catch(e){}return false;}
function addLog(who,what){S.log.unshift(`${nowStr()} [${who}] ${what}`);if(S.log.length>400)S.log.length=400;}
function nowStr(){const d=new Date();return `${S.simDate} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}

/* ═════════════════ 공통 ═════════════════ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2600);}
function modal(title,body,btns,opt){
  opt=opt||{};const pop=$('#pop');pop.className='pop'+(opt.confirm?' confirm':'');pop.style.minWidth='';
  $('#mTitle').textContent=title;const mb=$('#mBody');mb.innerHTML=(opt.confirm?`<div class="ct">${esc(title)}</div>`:'')+body;mb.className='pb'+(opt.html?'':' pre');
  const f=$('#mFoot');f.innerHTML='';
  (btns||[{t:'확인',p:true}]).forEach(b=>{const el=document.createElement('button');el.className='btn'+(b.p?'':' w');el.textContent=b.t;if(b.id)el.id=b.id;el.onclick=()=>{closeModal();b.f&&b.f();};f.appendChild(el);});
  $('#scrim').classList.add('on');
}
function closeModal(){$('#scrim').classList.remove('on');}
function confirmBox(title,body,onOk,okText){modal(title,body,[{t:okText||'확인',p:true,f:onOk,id:'b-modal-ok'},{t:'취소'}],{confirm:1});}
function alertBox(title,body){modal(title,body,[{t:'확인',p:true}],{confirm:1});}
const subj=id=>SUBJECTS.find(s=>s.id===id);
const subjLabel=id=>`${subj(id).name}(${subj(id).credit})`;
const userName=id=>(TEACHERS[id]||{}).name||id;
const homeroomOf=c=>Object.keys(TEACHERS).find(k=>TEACHERS[k].cls===c);
const students=cls=>S.students[cls]||[];
const allStudents=()=>Object.values(S.students).flat();
const studentById=id=>allStudents().find(s=>s.id===id);
const clsName=k=>{const [g,c]=k.split('-');return `${g}학년 ${c}반`;};
const roomLabel=(s,c)=>`${subj(s).name} ${clsName(c)}`;
const can={teacherOf:()=>true,homeroomOf:()=>true,admin:()=>true,approver:()=>true};
const total=s=>PERIODS[s].length;
const attendOf=(s,sid)=>total(s)-(S.absent[s][sid]||0);
const needAttend=s=>Math.ceil(total(s)*2/3);
const attOK=(s,sid)=>attendOf(s,sid)>=needAttend(s);
const achieve=v=>v>=90?'A':v>=80?'B':v>=70?'C':v>=60?'D':'E';
const finalOf=(s,sid)=>S.score[s][sid].final;
const achOK=(s,sid)=>finalOf(s,sid)>=40;
function shortfall(s,sid){const f=[];if(!attOK(s,sid))f.push('출석');if(!achOK(s,sid))f.push('학업');return f;}
const periodCloseCnt=(s,c)=>Object.keys(S.periodClose[s][c]).length;
const dayCloseCnt=(s,c)=>PERIODS[s].filter(x=>S.dayClose[c][x.d]).length;
const roomClosed=(s,c)=>!!S.roomClose[s][c];
const allRoomsClosed=()=>SUBJECTS.every(s=>CLASSES.every(c=>roomClosed(s.id,c)));
const attAllApproved=()=>!!S.attAll.approved;
const calcAllApproved=()=>!!S.calcAll.approved;
const msbOf=(s,c)=>S.msb[s][c];
const ICON={search:'<svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>',
  excel:'<svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.3"><rect x="2" y="2" width="12" height="12" rx="1"/><path d="M2 6h12M2 10h12M6 2v12M10 2v12"/></svg>',
  doc:'<svg viewBox="0 0 16 16" fill="none" stroke="#333" stroke-width="1.2"><path d="M4 1.5h5.5L13 5v9.5H4z"/><path d="M9.5 1.5V5H13M6 8h4M6 10.5h4"/></svg>',
  edit:'<svg viewBox="0 0 16 16" fill="none" stroke="#333" stroke-width="1.2"><path d="M3 2h7l3 3v9H3z"/><path d="M10 2v3h3M5.5 11.5l5-5 1.5 1.5-5 5H5.5z"/></svg>',
  list:'<svg viewBox="0 0 16 16" fill="none" stroke="#333" stroke-width="1.2"><rect x="2" y="3" width="12" height="10" rx="1"/><path d="M5 6.5h6M5 9.5h4"/><circle cx="11" cy="11" r="2" fill="#fff"/></svg>',
  lock:'<svg viewBox="0 0 16 16" fill="none" stroke="#333" stroke-width="1.2"><path d="M3 2h7l3 3v9H3z"/><path d="M10 2v3h3"/><rect x="6" y="8.5" width="4.5" height="3.5" rx=".5"/><path d="M7 8.5V7.5a1.3 1.3 0 0 1 2.6 0v1"/></svg>'};

/* ═════════════════ 로그인·메뉴 ═════════════════ */
function renderLogin(){}
function login(){
  me=ME;if(!load())seedData();
  cond.subj='mat';cond.cls='1-1';cond.room='all';queried={};
  $('#login').style.display='none';$('#app').classList.add('on');
  $('#gSchool').textContent=`${SCHOOL} · ${YEAR}학년도 ${SEM}학기`;
  $('#gUser').innerHTML=`<b>${me.name}</b>`;
  addLog(me.name,'로그인');save();
  go('guide','gd-steps');
}
function logout(){me=null;$('#app').classList.remove('on');$('#login').style.display='flex';$('#bot').classList.remove('on');}

/* 실제 나이스 메뉴 구성(연수 범위 밖 메뉴는 눌러도 안내만) */
const TOP=[{id:'hak',name:'학적'},{id:'cur',name:'교육과정'},{id:'score',name:'성적'},{id:'life',name:'학생생활'},{id:'rec',name:'학생부'},{id:'appr',name:'업무승인'},{id:'guide',name:'연수도우미',guide:true}];
const MENUS={
  hak:[{grp:'기본학적관리',items:['학생기본정보','학적변동','학생사진관리']},{grp:'전입관리',items:['전입학생관리']},{grp:'전출관리',items:['전출학생관리']},
       {grp:'학업중단관리',items:[{id:'hak-wd',name:'휴학/자퇴/퇴학/제적관리'},'학업중단숙려제관리']},{grp:'진급대상자 반편성관리',items:['반편성관리']},

const MENU_PATH={},MENU_GRP={};Object.entries(MENUS).forEach(([top,groups])=>{const tn=TOP.find(t=>t.id===top).name;groups.forEach(g=>g.items.forEach(i=>{if(typeof i==='object'){MENU_PATH[i.id]=`${tn} › ${g.grp} › ${i.name}`;MENU_GRP[i.id]=g.grp;}}));});

function go(top,menu){
  view.top=top;if(menu)view.menu=menu;else{const first=MENUS[top].flatMap(g=>g.items).find(i=>typeof i==='object');view.menu=first?first.id:null;}
  if(view.menu&&topOf(view.menu)===top)openGrp[top]=MENU_GRP[view.menu];

  $('#lnb').innerHTML=TOP.map(t=>`<button class="${t.guide?'guide ':''}${view.top===t.id?'on':''}" onclick="go('${t.id}')">${t.name}${t.id==='appr'&&pend?`<span class="badge">${pend}</span>`:''}</button>`).join('');
  $('#tree').innerHTML=MENUS[top].map(g=>`<div class="grp ${openGrp[top]===g.grp?'open':''}" onclick="toggleGrp('${top}','${g.grp}')">${g.grp}<span class="chev">▼</span></div><div class="items">${g.items.map(i=>typeof i==='object'?`<button class="it ${view.menu===i.id?'on':''} ${na&&na.menu===i.id?'next':''}" onclick="go('${top}','${i.id}')">${i.name}</button>`:`<button class="it" onclick="toast('연수 범위 밖 메뉴입니다. (실제 나이스에만 있음)')">${i}</button>`).join('')}</div>`).join('')+'<div class="fold">◀</div>';
  $('#gDate').textContent=`기준일 ${S.simDate}`;

}
function toggleGrp(top,g){openGrp[top]=openGrp[top]===g?null:g;document.querySelectorAll('#tree .grp').forEach(el=>{el.classList.toggle('open',el.textContent.replace('▼','')===(openGrp[top]||''));});}

function pageHead(t){return `<div class="ph"><h2><i></i>${t}</h2><span class="sp"></span><span class="crumb">${t}</span><button class="ib" title="글자 작게">A</button><button class="ib" title="글자 크게"><b>A</b></button><span class="ib-grp"><button class="ib">?</button><button class="ib">💬</button><button class="ib">📄</button><button class="ib">☎</button><button class="ib">▶</button><button class="ib">☆</button></span><button class="ib">축소</button><button class="ib hide" onclick="condHidden=!condHidden;render()">${condHidden?'조회보기':'조회숨김'}</button></div>`;}
function wizard(tabs,cur,fn,nextKey){return `<div class="wiz">${tabs.map((t,i)=>`${i?'<span class="arr">▶</span>':''}<div class="wt ${cur===t.id?'on':''} ${nextKey===t.id?'next':''}" onclick="${fn}('${t.id}')">${ICON[t.icon||'doc']}${t.name}</div>`).join('')}</div>`;}

function roomIssues(s,c){const a=periodCloseCnt(s,c),b=dayCloseCnt(s,c),t=total(s);const iss=[];if(a!==t)iss.push(`과목교시마감수(${a})가 시간표총수업수(${t})와 다릅니다. [과목별출결관리]에서 교과담당교사가 미마감 교시를 출결마감하세요.`);if(b!==t)iss.push(`반별일출결마감수(${b})가 시간표총수업수(${t})와 다릅니다. ${clsName(c)} 학급담임이 [일일출결관리]에서 미마감 일자를 출결마감하세요.`);return iss;}

function hpcSet(s,c,v){msbOf(s,c).hpc=+v||3;save();render();}
function hpcApply(s){const v=+($('#hpcIn')||{}).value;if(!(v>0)){alertBox('알림','학점당 시수를 입력해주세요.');return;}confirmBox('확인',`학점당 시수 ${v}시수를 조회된 모든 대상자에게 적용하시겠습니까?`,()=>{roomsOf().forEach(c=>msbOf(s,c).hpc=v);save();toast('적용되었습니다.');render();});}

function msbRoomStats(s,c){const m=msbOf(s,c);const need=subj(s).credit*m.hpc,base=Math.ceil(need*2/3);const T=msbTargets(s,c);let ex=0,done=0,un=0,pending=0;T.forEach(st=>{if(m.exc[st.id])ex++;else{const h=(m.hours[st.id]||{}).h;if(h==null)pending++;else if(h>=base)done++;else un++;}});return {t:T.length,ex,done,un,pending,applied:m.creditApplied?T.length:0};}
function msbCloseTab(s){

  const agg=rooms.reduce((a,c)=>{const r=msbRoomStats(s,c);Object.keys(r).forEach(k=>a[k]=(a[k]||0)+r[k]);return a;},{});
  const fetched=rooms.every(c=>msbOf(s,c).targets);const allApplied=rooms.every(c=>msbOf(s,c).creditApplied||!(msbOf(s,c).targets||[]).length);const allClosed=rooms.every(c=>msbOf(s,c).closed);
  return condBar(fixedCond()+selSubj()+selRoom(true),qbtn())
  +(q?`<div class="tbar"><span class="sec" style="margin:0">보장지도(추가학습) 대상은 다음과 같습니다.</span><span class="sp"></span><button class="btn" id="b-credit" ${ed&&fetched&&!agg.pending&&!allApplied?'':'disabled'} onclick="creditApply('${s}')">학점반영</button>${allClosed&&fetched?`<button class="btn w" ${ed&&!S.msbMgmt.saved?'':'disabled'} onclick="msbUnclose('${s}')">마감취소</button>`:`<button class="btn" id="b-close" ${ed&&allApplied&&fetched?'':'disabled'} onclick="msbClose('${s}')">마감</button>`}</div>
  <table class="sumtbl"><tr><td class="k">대상자</td><td class="v">${agg.t} 명</td></tr><tr><td class="k">예외처리자</td><td class="v">${agg.ex} 명</td></tr><tr><td class="k">이수자</td><td class="v">${agg.done} 명</td></tr><tr><td class="k">미이수자</td><td class="v">${agg.un} 명</td></tr><tr><td class="k">학점반영자</td><td class="v">${agg.applied} 명</td></tr><tr><td class="k">마감여부</td><td class="v">${allClosed&&fetched?'마감':'미마감'}${agg.pending?` <span style="color:var(--crit)">(참여시수 미입력 ${agg.pending}명 — [이수관리]에서 입력 후 학점반영 가능)</span>`:''}</td></tr></table>
  ${!fetched?'<div class="note">대상자를 가져오지 않은 강의실이 있습니다.</div>':''}`:needQuery());
}
function creditApply(s){const rooms=roomsOf();confirmBox('확인',`최소성취수준보장지도(추가학습) 결과를 학점에 반영하시겠습니까?\n\n· 이수자·예외처리자 → 이수\n· 미이수자 → 미이수`,()=>{rooms.forEach(c=>{const m=msbOf(s,c);if(m.targets)m.creditApplied={by:me.name,at:nowStr()};});addLog(me.name,`최성보 학점반영 ${s} ${rooms.join(',')}`);save();toast('학점이 반영되었습니다. 이어서 {마감}하세요.');render();});}
function msbClose(s){const rooms=roomsOf();confirmBox('확인',`최소성취수준보장지도(추가학습)를 마감하시겠습니까?\n마감 후에는 예외처리·참여시수를 수정할 수 없습니다.`,()=>{rooms.forEach(c=>{const m=msbOf(s,c);if(m.targets)m.closed={by:me.name,at:nowStr()};});addLog(me.name,`최성보 마감 ${s} ${rooms.join(',')}`);save();toast('마감되었습니다.');render();});}
function msbUnclose(s){confirmBox('확인','마감을 취소하시겠습니까? 학점반영도 함께 취소됩니다.',()=>{roomsOf().forEach(c=>{const m=msbOf(s,c);m.closed=null;m.creditApplied=null;});addLog(me.name,`최성보 마감취소 ${s}`);save();render();});}

/* 조회 */
function msbResult(s,c,sid){const m=msbOf(s,c);if(!m.targets||!m.targets.includes(sid))return null;const need=subj(s).credit*m.hpc,base=Math.ceil(need*2/3);const e=m.exc[sid];const h=(m.hours[sid]||{});return {exc:e,hpc:m.hpc,need,base,h:h.h,note:h.note,done:e?true:(h.h!=null&&h.h>=base),pending:!e&&h.h==null,applied:!!m.creditApplied,closed:!!m.closed};}
function viewRow(st,s,r,withCls){return `<tr>${withCls?`<td>${st.c}</td>`:''}<td>${st.no}</td><td class="l">${st.name} ${wdMark(st.id)}</td><td>${S.withdrawn[st.id]?S.withdrawn[st.id].type:''}</td><td>${subj(s).area}</td><td>${subjLabel(s)}</td><td>${subj(s).credit}</td><td>${r.hpc}</td><td>${attOK(s,st.id)?'도달':'미도달'}</td><td>${achOK(s,st.id)?'도달':'미도달'}</td><td>${r.exc?r.exc.type:''}</td><td class="l">${r.exc?esc(r.exc.reason||''):''}</td><td>${r.need}</td><td>${r.base}</td><td>${r.exc?0:(r.h??'')}</td><td>${r.exc?'이수':r.pending?'':r.done?'이수':'미이수'}</td><td class="l">${esc(r.note||'')}</td></tr>`;}
const viewHead=withCls=>`<thead><tr><th colspan="${withCls?4:3}" class="grp">최소 성취수준 보장지도(추가학습) 대상자</th><th colspan="4" class="grp">최소 성취수준 보장지도(추가학습) 대상과목</th><th colspan="4" class="grp">최소 성취수준 보장지도(추가학습) 사유</th><th colspan="5" class="grp">최소 성취수준 보장지도(추가학습)</th></tr><tr>${withCls?th('반','class="l2"'):''}${th('번호','class="l2"')}${th('성명','class="l2 l"')}${th('학적변동','class="l2"')}${th('편제','class="l2"')}${th('과목','class="l2"')}${th('학점','class="l2"')}${th('학점당<br>시수','class="l2"')}${th('과목<br>출석률','class="l2"')}${th('학업<br>성취률','class="l2"')}${th('예외','class="l2"')}${th('예외사유(기타)','class="l2 l"')}${th('필요<br>시수','class="l2"')}${th('이수<br>기준','class="l2"')}${th('참여<br>시수','class="l2"')}${th('이수여부','class="l2"')}${th('비고','class="l2 l"')}</tr></thead>`;
SCREENS['msb-view']=()=>{
  const mode=cond.vmode||'cls';const q=queried[view.menu];const f=cond.vf||'all';let rows='';
  if(mode==='cls'){const c=cond.cls;students(c).forEach(st=>SUBJECTS.forEach(s=>{const r=msbResult(s.id,c,st.id);if(r&&(f==='all'||!r.done))rows+=viewRow(st,s.id,r,false);}));}
  else{const s=cond.subj;roomsOf().forEach(c=>students(c).forEach(st=>{const r=msbResult(s,c,st.id);if(r&&(f==='all'||!r.done))rows+=viewRow(st,s,r,true);}));}
  return pageHead('최소성취수준보장지도(추가학습)조회')+`<div class="stabs"><button class="${mode==='cls'?'on':''}" onclick="cond.vmode='cls';unq();render()">소속반 기준(학급담임용)</button><button class="${mode==='subj'?'on':''}" onclick="cond.vmode='subj';unq();render()">수강과목 강의실 기준(교과담임용)</button></div>`
  +condBar(fixedCond()+(mode==='cls'?selCls():selSubj()+selRoom(true))+radio('vf',[['all','전체'],['un','미이수']],f,'vf'),qbtn())
  +(q?tbar(rows?rows.split('<tr>').length-1:0,printBtn())+(rows?`<div class="grid-wrap"><table class="grid">${viewHead(mode!=='cls')}<tbody>${rows}</tbody></table></div>`:'<div class="empty">조회된 자료가 없습니다.</div>'):needQuery());
};

/* 마감관리 */

  +(allClosed?'':'<div class="note">강의실별 마감여부가 X인 강의실이 있습니다. 해당 교과담임이 [최소성취수준보장지도(추가학습)이수관리 › 마감]에서 {학점반영} → {마감}해야 합니다.</div>')
  +`<div class="grid-wrap auto"><table class="grid"><thead><tr><th><input type="checkbox" checked disabled></th>${th('계열')}${th('학과')}${th('과목명(학점)')}${th('강의실/편성반')}${th('담당교사')}${th('보장지도대상인원')}${th('예외처리인원')}${th('이수처리인원')}${th('미이수 처리인원')}${th('학점반영 인원')}${th('강의실별<br>마감여부')}</tr></thead><tbody>${rows}</tbody></table></div>`:needQuery());
};

/* ═════════════════ 학생부 ═════════════════ */
function recRows(c){return students(c).map(st=>`<tr><td>${st.no}</td><td class="l">${st.name} ${wdMark(st.id)}</td>${SUBJECTS.map(s=>{const f=finalOf(s.id,st.id);const r=msbResult(s.id,c,st.id);const sf=shortfall(s.id,st.id);const stat=!sf.length?'이수':r&&r.applied?(r.done?'이수':'미이수'):'<span class="bad">미반영</span>';return `<td>${f}</td><td>${achieve(f)}</td><td class="${stat==='미이수'?'bad':''}">${stat}</td>`;}).join('')}</tr>`).join('');}
const recHead=`<thead><tr><th rowspan="2">번호</th><th rowspan="2" class="l">성명</th>${SUBJECTS.map(s=>`<th colspan="3" class="grp">${subjLabel(s.id)}</th>`).join('')}</tr><tr>${SUBJECTS.map(()=>th('원점수','class="l2"')+th('성취도','class="l2"')+th('이수여부','class="l2"')).join('')}</tr></thead>`;
SCREENS['rec-reflect']=()=>{
  const c=cond.cls;const q=queried[view.menu];const ed=can.homeroomOf(c);const R=S.recReflect[c];const unclosed=SUBJECTS.filter(s=>!msbOf(s.id,c).closed);
  return pageHead('학생부반영')+condBar(fixedCond()+selCls()+radio('rk',[['a','교과학습발달상황'],['b','출결상황'],['c','창의적체험활동']],'a','rk'),qbtn())
  +(q?`<div class="rem-l">※ 최소성취수준보장지도(추가학습) 마감 후 {학생부반영}을 누르면 과목별 이수/미이수 결과가 교과학습발달상황에 반영됩니다. 변경 지침에 따라 비고란에 별도 기재사항은 없습니다.</div>`
  +tbar(students(c).length,`<button class="btn" id="b-reflect" ${ed&&!unclosed.length&&!R?'':'disabled'} onclick="confirmBox('확인','${clsName(c)} 교과학습발달상황을 학생부에 반영하시겠습니까?',()=>{S.recReflect['${c}']={by:me.name,at:nowStr()};addLog(me.name,'학생부반영 ${c}');save();toast('반영되었습니다.');render();})">학생부반영</button>${printBtn()}`,R?`※ 반영완료 : ${R.by} ${R.at}`:unclosed.length?`※ 미마감 과목 : ${unclosed.map(s=>subjLabel(s.id)).join(', ')}`:'※ 반영 가능')
  +`<div class="grid-wrap"><table class="grid">${recHead}<tbody>${recRows(c)}</tbody></table></div>`:needQuery());
};
SCREENS['rec-view']=()=>{const c=cond.cls;const q=queried[view.menu];return pageHead('교과학습발달상황')+condBar(fixedCond()+selCls(),qbtn())+(q?tbar(students(c).length,printBtn(),S.recReflect[c]?'※ 학생부반영 완료 자료':'※ 학생부반영 전 자료')+`<div class="grid-wrap"><table class="grid">${recHead}<tbody>${recRows(c)}</tbody></table></div>`:needQuery());};

/* ═════════════════ 업무승인 ═════════════════ */
SCREENS['appr-box']=()=>{
  const ak=cond.ak||'w';const list=S.approvals.slice().reverse().filter(a=>ak==='w'?a.status==='대기':a.status!=='대기');
  const rows=list.map(a=>`<tr><td><input type="checkbox" disabled></td><td>${a.at}</td><td class="l">${a.title}</td><td>${a.by}</td><td>${a.status==='대기'?'결재대기':a.status}</td><td>${a.decidedAt||''}</td><td>${a.status==='대기'?`<button class="btn s" id="b-approve" ${can.approver()?'':'disabled'} onclick="decide('${a.id}','승인')">승인</button> <button class="btn s w" ${can.approver()?'':'disabled'} onclick="decide('${a.id}','반려')">반려</button>`:''}</td></tr>`).join('');
  return pageHead('승인요청결재')+condBar(fixedCond(1)+radio('ak',[['w','결재대기'],['d','결재완료']],cond.ak||'w','ak'),qbtn())+(queried[view.menu]?`<div class="rem-l">※ 실제 나이스에서는 결재권자가 업무승인과정(결재선)에 따라 결재합니다. 연수에서는 이 화면에서 {승인}을 눌러 결재 완료 상태를 만듭니다.</div>`+tbar(list.length,printBtn())+(rows?`<div class="grid-wrap auto"><table class="grid"><thead><tr><th><input type="checkbox" disabled></th>${th('요청일시')}${th('제목','class="l"')}${th('요청자')}${th('상태')}${th('결재일시')}<th>처리</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="empty">조회된 자료가 없습니다.</div>'):needQuery());
};
function decide(id,st){const a=S.approvals.find(x=>x.id===id);const obj={attAll:S.attAll,calcAll:S.calcAll,msb:S.msbMgmt}[a.type];
  confirmBox('확인',`"${a.title}" 건을 ${st}하시겠습니까?`,()=>{a.status=st;a.decidedAt=nowStr();if(st==='승인')obj.approved={by:'결재권자',at:nowStr()};else{obj.req=null;}addLog(me.name,`결재 ${st}: ${a.title}`);save();toast(`${st} 처리되었습니다.`);render();});}

/* ═════════════════ 다음에 누를 버튼(순서 안내) ═════════════════ */
function nextAction(){
  const Q=m=>!!queried[m];
  for(const s of SUBJECTS)for(const c of CLASSES){
    if(roomClosed(s.id,c))continue;const t=total(s.id);
    if(periodCloseCnt(s.id,c)!==t)return {step:1,title:'[1단계] 과목 출석률 마감 — 교시 출결마감 보완',role:`교과담임(${userName(s.teacher)})`,ok:true,menu:'att-subj',tab:'period',set:{subj:s.id,room:c,atab:'period'},
      why:`${roomLabel(s.id,c)} 강의실은 과목교시마감수가 시간표총수업수와 달라 학기별과목마감이 안 됩니다. 미마감 교시를 먼저 출결마감합니다.`,
      seq:[{t:'[과목별출결관리] 탭',tab:'period'},{t:`조회조건: 과목 <b>${subjLabel(s.id)}</b> · 강의실 <b>${c.split('-')[1]}</b>`,f:'f-subj'},{t:'[조회]',b:'b-query',done:Q('att-subj')},{t:'[미마감 일괄마감]',b:'b-bulk'},{t:'확인창 [확인]',b:'b-modal-ok'}]};
    if(PERIODS[s.id].some(x=>!S.dayClose[c][x.d]))return {step:1,title:'[1단계] 과목 출석률 마감 — 학급 일출결마감 보완',role:`${clsName(c)} 학급담임(${userName(homeroomOf(c))})`,ok:true,menu:'att-day',set:{cls:c},
      why:`${clsName(c)}에 일출결이 마감되지 않은 날이 있어 ${subjLabel(s.id)}의 반별일출결마감수가 총수업수와 다릅니다.`,
      seq:[{t:`조회조건: 반 <b>${c.split('-')[1]}</b>`,f:'f-cls'},{t:'[조회]',b:'b-query',done:Q('att-day')},{t:'[미마감 일괄마감]',b:'b-bulk'},{t:'확인창 [확인]',b:'b-modal-ok'}]};
    return {step:1,title:'[1단계] 과목 출석률 마감 — 학기별과목마감',role:`교과담임(${userName(s.teacher)})`,ok:true,menu:'att-subj',tab:'room',set:{subj:s.id,atab:'room'},
      why:`${roomLabel(s.id,c)} 강의실을 학기별과목마감합니다.`,
      seq:[{t:'[학기별과목출결마감] 탭',tab:'room'},{t:`조회조건: 과목 <b>${subjLabel(s.id)}</b>`,f:'f-subj'},{t:'[조회]',b:'b-query',done:Q('att-subj')},{t:`${c.split('-')[1]}반 행의 [학기별과목마감]`,b:`b-room-${c}`},{t:'확인창 [확인]',b:'b-modal-ok'}]};
  }
  if(!S.attAll.done)return {step:1,title:'[1단계] 과목 출석률 마감 — 과목전체마감',role:'업무담당자',ok:true,menu:'att-subj',tab:'all',set:{atab:'all'},why:'모든 강의실이 마감되었습니다. 업무담당자가 전체마감하고 승인요청합니다.',
    seq:[{t:'[과목전체마감] 탭',tab:'all'},{t:'[조회]',b:'b-query',done:Q('att-subj')},{t:'[전체마감]',b:'b-attall'},{t:'확인창 [확인]',b:'b-modal-ok'},{t:'[승인요청]',b:'b-attreq'}]};
  if(!S.attAll.req)return {step:1,title:'[1단계] 과목 출석률 마감 — 승인요청',role:'업무담당자',ok:true,menu:'att-subj',tab:'all',set:{atab:'all'},why:'전체마감이 끝났습니다. 승인요청(결재 상신)합니다.',seq:[{t:'[과목전체마감] 탭',tab:'all'},{t:'[조회]',b:'b-query',done:Q('att-subj')},{t:'[승인요청]',b:'b-attreq'}]};
  if(!S.attAll.approved)return apprAction(1,'과목출결 전체마감');
  for(const s of SUBJECTS){const e=S.examClose[s.id];if(!e.written)return examAction(s,'written');if(!e.perf)return examAction(s,'perf');}
  if(!S.calcAll.done)return {step:2,title:'[2단계] 학기말 성적 산출 마감 — 전체마감',role:'업무담당자',ok:true,menu:'calc-close',why:'모든 과목의 정기시험·수행평가가 마감되었습니다. 성적산출전체마감 후 승인요청합니다.',

  if(/승인|결재/.test(t))return say2('<b>승인요청</b>은 결재 상신이에요. 실제 나이스에서는 결재권자가 결재하지만, 연수에서는 <code>업무승인 › 승인요청결재</code>에서 직접 [승인]을 눌러 결재 완료 상태를 만들어요.');
  if(!na)return say2('🎉 8단계가 모두 끝났어요! 수고하셨어요. 다시 연습하려면 "초기화"라고 말해 주세요.');
  if(/왜|안 돼|안돼|비활성|회색|못 눌|안 눌/.test(t))return say2(`지금 단계가 막힌 이유는 이거예요 🔍<br>${na.why}<br><br>${here?'번호가 붙은 버튼을 순서대로 눌러 보세요.':'<button class="btn s" onclick="guideGo()">🚀 그 화면으로 데려다줘</button>'}`);
  if(/다음|뭐|해야|할 일|순서|어디|어떻게/.test(t)){chatSig='';return setTimeout(()=>renderGuide(true),350);}
  say2('음… 그건 아직 잘 모르겠어요 🤖 "다음", "왜", "흐름", "기준" 같은 말로 물어봐 주세요!');}
function renderGuide(force){
  const p=$('#bot');if(!guideOn||!me){p.classList.remove('on');return;}p.classList.add('on');
  if(!$('#botAv').dataset.ready){$('#botAv').insertAdjacentHTML('afterbegin',BOT_SVG());$('#botFace').innerHTML=BOT_SVG();$('#botAv').dataset.ready=1;botRestorePos();try{const z=+localStorage.getItem('neis-peek-zoom');if(z)$('#bot').style.setProperty('--pz',z);}catch(_){}}
  const na=nextAction();
  if(!na){$('#botPeek').innerHTML='<div class="pk-t">완료</div><div class="pk-m">🎉 8단계가 모두 끝났어요!</div><div class="pk-s">수고하셨어요. 다시 하려면 초기화하세요.</div><div class="pk-b"><button class="w" onclick="go(\'guide\',\'gd-setting\')">처음부터 다시</button><span class="pk-z"><button onclick="peekZoom(-1)">가−</button><button onclick="peekZoom(1)">가+</button></span></div>';if(chatSig!=='done'){chatSig='done';say('🎉 8단계가 모두 끝났어요! 최소 성취수준 보장지도 업무 완료예요. 수고하셨어요 👏<br>다시 연습하려면 "초기화"라고 말해 주세요.');}return;}
  const here=view.menu===na.menu&&(!na.tab||curTab(na)===na.tab);
  const condOK=!na.set||Object.entries(na.set).every(([k,v])=>k==='atab'||k==='tab'||cond[k]===v);
  let curIdx=-1;const items=na.seq.map((x,i)=>{let done=here&&!!x.done&&condOK;if(x.f)done=here&&condOK;if(x.tab&&here)done=true;if(!done&&curIdx<0)curIdx=i;return {...x,done};});
  if(!here)curIdx=-1;
  const stepName=na.title.replace(/^\[\d단계\] /,'');const tabName2=na.tab?(na.menu==='msb-manage'?MSB_TABS:ATT_TABS).find(t=>t.id===na.tab).name:'';
  const cur=items[curIdx];const peekMain=here&&cur?`<span class="n">${curIdx+1}</span>${cur.b==='b-modal-ok'?'확인창에서 <b>[확인]</b>을 누르세요':cur.f?cur.t.replace('조회조건: ','조회조건을 바꾸세요 → ')+' <small>(또는 아래 [데려다줘])</small>':cur.b?`<b>${cur.t.replace(/^\[(.+)\]$/,'[$1]')}</b> 버튼을 누르세요`:cur.t}`:`<b>${MENU_PATH[na.menu].split(' › ').slice(-1)[0]}</b>${na.tab?` › ${tabName2.replace('최소성취수준보장지도(추가학습)','')} 탭`:''} 화면으로 가세요`;
  const peekSub=here?(curIdx+1<items.length?`다음: ${items[curIdx+1].t.replace(/<[^>]+>/g,'')}`:'이게 이 화면의 마지막이에요'):`메뉴 ${MENU_PATH[na.menu]}`;
  $('#botPeek').innerHTML=`<div class="pk-t">${na.step}단계 · ${stepName}</div><div class="pk-m">${peekMain}</div><div class="pk-s">${peekSub}</div><div class="pk-b">${here&&condOK?'':'<button onclick="guideGo()">🚀 데려다줘</button>'}<button class="w" onclick="chatOpen(true)">💬 대화하기</button><span class="pk-z"><button onclick="peekZoom(-1)" title="글자 작게">가−</button><button onclick="peekZoom(1)" title="글자 크게">가+</button></span></div>`;
  const sig=`${na.title}|${here}|${condOK}|${curIdx}|${view.menu}|${curTab(na)}`;
  if(force||sig!==chatSig){chatSig=sig;if(!chatLog.length)say('안녕하세요! 저는 <b>최성봇</b>이에요 🤖 최소 성취수준 보장지도 8단계를 순서대로 안내해 드릴게요. 헷갈리면 언제든 물어보세요!');say(stepBubble(na,items,curIdx,here,condOK));}
  if(here){items.forEach((x,i)=>{if(x.b&&x.b!=='b-modal-ok'){const el=document.getElementById(x.b);if(el){const n=document.createElement('span');n.className='gnum'+(x.done?' done':'');n.textContent=i+1;el.appendChild(n);if(i===curIdx)el.classList.add('next');}}
      if(x.f&&i===curIdx){const el=document.getElementById(x.f);if(el)el.classList.add('next-field');}
      if(x.cell&&i===curIdx){document.querySelectorAll('.'+x.cell).forEach(td=>td.classList.add('next-cell'));}});}
}

];}
